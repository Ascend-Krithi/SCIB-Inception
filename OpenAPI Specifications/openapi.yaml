openapi: 3.0.3
info:
  title: Youth Account Management API
  description: |
    API for managing youth accounts, including dashboard retrieval, fund transfers, spending limit configuration, and transaction history.
    
    **Security & Compliance:**
    - OAuth 2.0 enforced for all endpoints
    - RBAC (parents only)
    - GDPR, PCI-DSS, ISO 27001 compliant
    - All actions logged for auditability
  version: 1.0.0
  contact:
    name: API Team
    email: api-support@banking.example.com
servers:
  - url: https://api.banking.example.com
    description: Production
  - url: https://api.sandbox.banking.example.com
    description: Sandbox
security:
  - OAuth2: []
  - RBAC: []
tags:
  - name: Dashboard
    description: Dashboard retrieval
  - name: Fund Transfer
    description: Fund transfer to youth account
  - name: Spending Limit
    description: Configure spending limits
  - name: Transactions
    description: Transaction history
paths:
  /api/youth-accounts/{youthAccountId}/dashboard:
    get:
      tags:
        - Dashboard
      summary: Retrieve youth account dashboard details
      description: Returns account balance, spending limit, currency, and recent transactions for a youth account.
      operationId: getYouthAccountDashboard
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthAccountDashboardResponse'
        '403':
          description: Unauthorized (ownership validation)
        '404':
          description: Not Found
        '500':
          description: Internal Error
      security:
        - OAuth2: [parent]
        - RBAC: [parent]
  /api/youth-accounts/{youthAccountId}/fund-transfer:
    post:
      tags:
        - Fund Transfer
      summary: Transfer funds from parent to youth account
      description: Transfers funds from parent to youth account, returns transfer status and updated balance.
      operationId: postYouthAccountFundTransfer
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundTransferRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundTransferResponse'
        '400':
          description: Insufficient balance or invalid account mapping
        '500':
          description: Transfer service failure
      security:
        - OAuth2: [parent]
        - RBAC: [parent]
  /api/youth-accounts/{youthAccountId}/spending-limit:
    put:
      tags:
        - Spending Limit
      summary: Configure weekly spending limit
      description: Sets or updates weekly spending limit for a youth account.
      operationId: putYouthAccountSpendingLimit
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendingLimitRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingLimitResponse'
        '400':
          description: Validation error (invalid value)
        '403':
          description: Unauthorized
        '500':
          description: Internal Error
      security:
        - OAuth2: [parent]
        - RBAC: [parent]
  /api/youth-accounts/{youthAccountId}/transactions:
    get:
      tags:
        - Transactions
      summary: Retrieve youth account transaction history
      description: Returns paginated transaction history for a youth account.
      operationId: getYouthAccountTransactions
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
        '403':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Error
      security:
        - OAuth2: [parent]
        - RBAC: [parent]
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.banking.example.com/oauth/authorize
          tokenUrl: https://auth.banking.example.com/oauth/token
          scopes:
            parent: Grants parent access to youth account APIs
    RBAC:
      type: apiKey
      in: header
      name: X-Role
      description: Must be set to 'parent' for all endpoints
  schemas:
    YouthAccountDashboardResponse:
      type: object
      properties:
        youthAccountId:
          type: string
        accountBalance:
          type: number
          format: double
        spendingLimit:
          type: number
          format: double
        currency:
          type: string
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTransaction'
      required:
        - youthAccountId
        - accountBalance
        - spendingLimit
        - currency
        - recentTransactions
    DashboardTransaction:
      type: object
      properties:
        transactionId:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
          format: double
      required:
        - transactionId
        - date
        - description
        - amount
    FundTransferRequest:
      type: object
      properties:
        sourceAccountId:
          type: string
        transferAmount:
          type: number
          format: double
        currency:
          type: string
      required:
        - sourceAccountId
        - transferAmount
        - currency
    FundTransferResponse:
      type: object
      properties:
        transferId:
          type: string
        status:
          type: string
          enum: [SUCCESS]
        updatedBalance:
          type: number
          format: double
      required:
        - transferId
        - status
        - updatedBalance
    SpendingLimitRequest:
      type: object
      properties:
        weeklyLimit:
          type: number
          format: double
      required:
        - weeklyLimit
    SpendingLimitResponse:
      type: object
      properties:
        youthAccountId:
          type: string
        weeklyLimit:
          type: number
          format: double
        status:
          type: string
          enum: [UPDATED]
      required:
        - youthAccountId
        - weeklyLimit
        - status
    TransactionHistoryResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - transactions
        - pagination
    TransactionRecord:
      type: object
      properties:
        transactionId:
          type: string
        date:
          type: string
          format: date-time
        merchant:
          type: string
        amount:
          type: number
          format: double
        transactionType:
          type: string
          enum: [debit, credit]
      required:
        - transactionId
        - date
        - merchant
        - amount
        - transactionType
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalRecords:
          type: integer
      required:
        - page
        - pageSize
        - totalRecords
