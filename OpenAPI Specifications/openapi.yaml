openapi: 3.0.3
info:
  title: Youth Account API
  description: |
    APIs for parent fund allocation and management for youth accounts.
    - Supports dashboard, fund transfer, spending limits, transaction history.
    - OAuth2 authentication, RBAC enforced.
    - Compliant with GDPR, PCI-DSS, ISO 27001.
    - All actions audited and logged.
  version: 1.0.0
  contact:
    name: SCIB-Inception API Team
    url: https://github.com/Ascend-Krithi/SCIB-Inception
    email: api-support@ascend-krithi.com
servers:
  - url: https://api.ascend-krithi.com
    description: Production server
  - url: https://sandbox.api.ascend-krithi.com
    description: Sandbox server
security:
  - OAuth2: []
tags:
  - name: Youth Account Dashboard
    description: Retrieve youth account dashboard information
  - name: Fund Transfer
    description: Transfer funds from parent to youth account
  - name: Spending Limit
    description: Configure weekly spending limit for youth account
  - name: Transaction History
    description: Retrieve youth account transaction history
paths:
  /api/youth-accounts/{youthAccountId}/dashboard:
    get:
      tags: [Youth Account Dashboard]
      summary: Get youth account dashboard
      description: Retrieve youth account dashboard details
      operationId: getYouthAccountDashboard
      security:
        - OAuth2: []
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
          description: Youth account identifier
      responses:
        '200':
          description: Successful dashboard retrieval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthAccountDashboard'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/youth-accounts/{youthAccountId}/fund-transfer:
    post:
      tags: [Fund Transfer]
      summary: Transfer funds to youth account
      description: Transfer funds from parent to youth account
      operationId: transferFundsToYouthAccount
      security:
        - OAuth2: []
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
          description: Youth account identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundTransferRequest'
      responses:
        '200':
          description: Fund transfer successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundTransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/youth-accounts/{youthAccountId}/spending-limit:
    put:
      tags: [Spending Limit]
      summary: Set weekly spending limit
      description: Configure weekly spending limit for youth account
      operationId: setSpendingLimit
      security:
        - OAuth2: []
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
          description: Youth account identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendingLimitRequest'
      responses:
        '200':
          description: Spending limit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingLimitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
  /api/youth-accounts/{youthAccountId}/transactions:
    get:
      tags: [Transaction History]
      summary: Get transaction history
      description: Retrieve youth account transaction history
      operationId: getTransactionHistory
      security:
        - OAuth2: []
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
          description: Youth account identifier
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter transactions from this date (inclusive)
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter transactions until this date (inclusive)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Page size for pagination (default 20)
      responses:
        '200':
          description: Transaction history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.ascend-krithi.com/oauth2/authorize
          tokenUrl: https://auth.ascend-krithi.com/oauth2/token
          scopes:
            youth_account.read: View youth account information
            youth_account.write: Manage youth account and transfer funds
  schemas:
    YouthAccountDashboard:
      type: object
      properties:
        youthAccountId:
          type: string
        accountBalance:
          type: number
          format: decimal
        spendingLimit:
          type: number
          format: decimal
        currency:
          type: string
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/RecentTransaction'
    RecentTransaction:
      type: object
      properties:
        transactionId:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
          format: decimal
    FundTransferRequest:
      type: object
      required:
        - sourceAccountId
        - transferAmount
        - currency
      properties:
        sourceAccountId:
          type: string
        transferAmount:
          type: number
          format: decimal
        currency:
          type: string
    FundTransferResponse:
      type: object
      properties:
        transferId:
          type: string
        status:
          type: string
          enum: [SUCCESS, FAILURE]
        updatedBalance:
          type: number
          format: decimal
    SpendingLimitRequest:
      type: object
      required:
        - weeklyLimit
      properties:
        weeklyLimit:
          type: number
          format: decimal
    SpendingLimitResponse:
      type: object
      properties:
        youthAccountId:
          type: string
        weeklyLimit:
          type: number
          format: decimal
        status:
          type: string
          enum: [UPDATED]
    TransactionHistoryResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Transaction:
      type: object
      properties:
        transactionId:
          type: string
        date:
          type: string
          format: date-time
        merchant:
          type: string
        amount:
          type: number
          format: decimal
        transactionType:
          type: string
          enum: [debit, credit]
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalRecords:
          type: integer
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
        details:
          type: string
  responses:
    Unauthorized:
      description: Unauthorized or forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            error:
              value:
                errorCode: UNAUTHORIZED
                message: Access denied. Valid OAuth2 token required.
                details: ''
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            error:
              value:
                errorCode: NOT_FOUND
                message: Resource not found.
                details: ''
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            error:
              value:
                errorCode: INTERNAL_ERROR
                message: An unexpected error occurred.
                details: ''
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            error:
              value:
                errorCode: BAD_REQUEST
                message: Invalid input or parameters.
                details: ''
