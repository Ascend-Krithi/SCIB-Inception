openapi: 3.0.3
info:
  title: Youth Account Management API
  version: '1.0.0'
  description: |
    APIs for parental oversight, fund management, and activity visibility in youth banking accounts. All endpoints require OAuth2 Bearer token. RBAC enforced: parents can manage owned youth accounts; youth may only view dashboard. All actions are logged for audit.
  termsOfService: https://scib-inception.example.com/terms
  contact:
    name: SCIB-Inception API Team
    email: apiteam@scib-inception.example.com
    url: https://scib-inception.example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api.scib-inception.example.com
security:
  - bearerAuth: []
paths:
  /api/youth-accounts/{youthAccountId}/dashboard:
    get:
      summary: Get youth account dashboard
      description: Retrieves consolidated dashboard info (balance, limit, recent transactions). Youth may only view their own dashboard.
      operationId: getYouthAccountDashboard
      tags: [Dashboard]
      parameters:
        - $ref: '#/components/parameters/YouthAccountId'
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthAccountDashboard'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/youth-accounts/{youthAccountId}/fund-transfer:
    post:
      summary: Fund transfer to youth account
      description: Transfers funds from parent account to youth account. Only parent may initiate.
      operationId: transferFundsToYouth
      tags: [FundTransfer]
      parameters:
        - $ref: '#/components/parameters/YouthAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundTransferRequest'
      responses:
        '200':
          description: Transfer result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundTransferResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/youth-accounts/{youthAccountId}/spending-limit:
    put:
      summary: Set weekly spending limit
      description: Configure weekly spending limit for youth account. Only parent may modify.
      operationId: setWeeklySpendingLimit
      tags: [SpendingLimit]
      parameters:
        - $ref: '#/components/parameters/YouthAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendingLimitRequest'
      responses:
        '200':
          description: Limit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingLimitResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/youth-accounts/{youthAccountId}/transactions:
    get:
      summary: Get transaction history
      description: Returns transaction history for youth account (paginated, filterable by date). Only parent or youth may access for their account.
      operationId: getYouthAccountTransactions
      tags: [Transactions]
      parameters:
        - $ref: '#/components/parameters/YouthAccountId'
        - name: startDate
          in: query
          description: Start date (ISO 8601)
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: End date (ISO 8601)
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Page size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    YouthAccountId:
      name: youthAccountId
      in: path
      required: true
      description: Youth account identifier
      schema:
        type: string
  schemas:
    YouthAccountDashboard:
      type: object
      required:
        - youthAccountId
        - accountBalance
        - spendingLimit
        - currency
        - recentTransactions
      properties:
        youthAccountId:
          type: string
        accountBalance:
          type: number
          format: double
        spendingLimit:
          type: number
          format: double
        currency:
          type: string
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTransaction'
    DashboardTransaction:
      type: object
      required:
        - transactionId
        - date
        - description
        - amount
      properties:
        transactionId:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
          format: double
    FundTransferRequest:
      type: object
      required:
        - sourceAccountId
        - transferAmount
        - currency
      properties:
        sourceAccountId:
          type: string
        transferAmount:
          type: number
          format: double
        currency:
          type: string
    FundTransferResponse:
      type: object
      required:
        - transferId
        - status
        - updatedBalance
      properties:
        transferId:
          type: string
        status:
          type: string
          enum: [SUCCESS, FAILED]
        updatedBalance:
          type: number
          format: double
    SpendingLimitRequest:
      type: object
      required:
        - weeklyLimit
      properties:
        weeklyLimit:
          type: number
          format: double
    SpendingLimitResponse:
      type: object
      required:
        - youthAccountId
        - weeklyLimit
        - status
      properties:
        youthAccountId:
          type: string
        weeklyLimit:
          type: number
          format: double
        status:
          type: string
          enum: [UPDATED]
    TransactionHistoryResponse:
      type: object
      required:
        - transactions
        - pagination
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Transaction:
      type: object
      required:
        - transactionId
        - date
        - merchant
        - amount
        - transactionType
      properties:
        transactionId:
          type: string
        date:
          type: string
          format: date-time
        merchant:
          type: string
        amount:
          type: number
          format: double
        transactionType:
          type: string
          enum: [debit, credit]
    Pagination:
      type: object
      required:
        - page
        - pageSize
        - totalRecords
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalRecords:
          type: integer
          minimum: 0
    Error:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    Forbidden:
      description: Forbidden - insufficient rights or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request - validation or business rule error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
