openapi: 3.0.3
info:
  title: Youth Account Management API
  description: |
    APIs for parents/guardians to allocate and manage funds for youth accounts.
    Endpoints include dashboard retrieval, fund transfer, spending limit configuration, and transaction history.
    All endpoints secured by OAuth, RBAC, audit logging, and compliant with GDPR, PCI-DSS, ISO 27001.
  version: "1.0.0"
  contact:
    name: API Support
    email: support@banking.example.com
servers:
  - url: https://api.banking.example.com
    description: Production server
security:
  - OAuth2: []
tags:
  - name: YouthAccount
    description: Operations for youth account management
  - name: FundTransfer
    description: Fund transfer operations
  - name: SpendingLimit
    description: Spending limit configuration
  - name: TransactionHistory
    description: Transaction history retrieval

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.banking.example.com/oauth/authorize
          tokenUrl: https://auth.banking.example.com/oauth/token
          scopes:
            parent: Manage youth accounts
            youth: View own account
  schemas:
    YouthAccountDashboard:
      type: object
      properties:
        youthAccountId:
          type: string
        accountBalance:
          type: number
          format: decimal
        spendingLimit:
          type: number
          format: decimal
        currency:
          type: string
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSummary'
    TransactionSummary:
      type: object
      properties:
        transactionId:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
          format: decimal
    FundTransferRequest:
      type: object
      properties:
        sourceAccountId:
          type: string
        transferAmount:
          type: number
          format: decimal
        currency:
          type: string
      required:
        - sourceAccountId
        - transferAmount
        - currency
    FundTransferResponse:
      type: object
      properties:
        transferId:
          type: string
        status:
          type: string
          enum: [SUCCESS, FAILURE]
        updatedBalance:
          type: number
          format: decimal
    SpendingLimitRequest:
      type: object
      properties:
        weeklyLimit:
          type: number
          format: decimal
      required:
        - weeklyLimit
    SpendingLimitResponse:
      type: object
      properties:
        youthAccountId:
          type: string
        weeklyLimit:
          type: number
          format: decimal
        status:
          type: string
          enum: [UPDATED, FAILURE]
    TransactionHistory:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDetails'
        pagination:
          $ref: '#/components/schemas/Pagination'
    TransactionDetails:
      type: object
      properties:
        transactionId:
          type: string
        date:
          type: string
          format: date-time
        merchant:
          type: string
        amount:
          type: number
          format: decimal
        transactionType:
          type: string
          enum: [debit, credit]
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalRecords:
          type: integer
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
        details:
          type: string

paths:
  /api/youth-accounts/{youthAccountId}/dashboard:
    get:
      tags: [YouthAccount]
      summary: Retrieve youth account dashboard
      description: Returns consolidated youth account info: balance, spending limit, recent transactions.
      security:
        - OAuth2: [parent]
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthAccountDashboard'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-audit: true

  /api/youth-accounts/{youthAccountId}/fund-transfer:
    post:
      tags: [FundTransfer]
      summary: Transfer funds from parent to youth account
      security:
        - OAuth2: [parent]
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundTransferRequest'
      responses:
        '200':
          description: Transfer result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundTransferResponse'
        '400':
          description: Insufficient funds or invalid mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Transfer failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-audit: true

  /api/youth-accounts/{youthAccountId}/spending-limit:
    put:
      tags: [SpendingLimit]
      summary: Configure weekly spending limit for youth account
      security:
        - OAuth2: [parent]
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendingLimitRequest'
      responses:
        '200':
          description: Spending limit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingLimitResponse'
        '400':
          description: Invalid value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-audit: true

  /api/youth-accounts/{youthAccountId}/transactions:
    get:
      tags: [TransactionHistory]
      summary: Retrieve youth account transaction history
      security:
        - OAuth2: [parent]
      parameters:
        - name: youthAccountId
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Transaction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistory'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-audit: true

x-compliance:
  GDPR: true
  PCI-DSS: true
  ISO27001: true
x-performance:
  maxResponseTimeMs: 500
x-rbac:
  enforced: true
x-auditability:
  enabled: true