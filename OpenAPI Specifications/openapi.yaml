openapi: 3.0.3
info:
  title: Youth Account Management Platform API
  version: '1.0.0'
  description: |
    REST APIs for the Youth Account Management Platform enabling parents/guardians to allocate, monitor, and control funds for youth accounts. All endpoints require OAuth2 authentication and RBAC enforcement.
    
    Security, audit, and compliance standards enforced (GDPR, PCI-DSS, ISO 27001).
servers:
  - url: https://api.youthaccount.example.com
security:
  - OAuth2: []
tags:
  - name: Youth Account
    description: Operations for youth account management
  - name: Fund Transfer
    description: Parent-to-youth fund transfer
  - name: Spending Limit
    description: Spending limit configuration
  - name: Transactions
    description: Transaction history and activity
paths:
  /api/youth-accounts/{youthAccountId}/dashboard:
    get:
      tags: [Youth Account]
      summary: Retrieve consolidated youth account details
      operationId: getYouthAccountDashboard
      parameters:
        - in: path
          name: youthAccountId
          schema:
            type: string
          required: true
          description: Youth account ID
      responses:
        '200':
          description: Dashboard details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthAccountDashboard'
        '403': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - OAuth2: []
  /api/youth-accounts/{youthAccountId}/fund-transfer:
    post:
      tags: [Fund Transfer]
      summary: Transfer funds from parent to youth account
      operationId: transferFundsToYouth
      parameters:
        - in: path
          name: youthAccountId
          schema:
            type: string
          required: true
          description: Youth account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundTransferRequest'
      responses:
        '200':
          description: Fund transfer result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundTransferResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - OAuth2: []
  /api/youth-accounts/{youthAccountId}/spending-limit:
    put:
      tags: [Spending Limit]
      summary: Configure weekly spending limit
      operationId: setSpendingLimit
      parameters:
        - in: path
          name: youthAccountId
          schema:
            type: string
          required: true
          description: Youth account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendingLimitRequest'
      responses:
        '200':
          description: Weekly limit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingLimitResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - OAuth2: []
  /api/youth-accounts/{youthAccountId}/transactions:
    get:
      tags: [Transactions]
      summary: Retrieve youth account transaction history
      operationId: getYouthAccountTransactions
      parameters:
        - in: path
          name: youthAccountId
          schema:
            type: string
          required: true
          description: Youth account ID
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
          required: false
          description: Filter transactions from this date
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
          required: false
          description: Filter transactions up to this date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          required: false
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
          description: Number of records per page
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
        '403': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - OAuth2: []
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.youthaccount.example.com/oauth2/authorize
          tokenUrl: https://login.youthaccount.example.com/oauth2/token
          scopes:
            openid: OpenID Connect scope
            profile: Basic profile info
            manage: Manage youth accounts
  schemas:
    YouthAccountDashboard:
      type: object
      properties:
        youthAccountId:
          type: string
        accountBalance:
          type: number
          format: double
        spendingLimit:
          type: number
          format: double
        currency:
          type: string
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSummary'
      required: [youthAccountId, accountBalance, spendingLimit, currency, recentTransactions]
    TransactionSummary:
      type: object
      properties:
        transactionId:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
          format: double
      required: [transactionId, date, description, amount]
    FundTransferRequest:
      type: object
      properties:
        sourceAccountId:
          type: string
        transferAmount:
          type: number
          format: double
        currency:
          type: string
      required: [sourceAccountId, transferAmount, currency]
    FundTransferResponse:
      type: object
      properties:
        transferId:
          type: string
        status:
          type: string
          enum: [SUCCESS, FAILED]
        updatedBalance:
          type: number
          format: double
      required: [transferId, status, updatedBalance]
    SpendingLimitRequest:
      type: object
      properties:
        weeklyLimit:
          type: number
          format: double
      required: [weeklyLimit]
    SpendingLimitResponse:
      type: object
      properties:
        youthAccountId:
          type: string
        weeklyLimit:
          type: number
          format: double
        status:
          type: string
          enum: [UPDATED]
      required: [youthAccountId, weeklyLimit, status]
    TransactionHistoryResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDetail'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
      required: [transactions, pagination]
    TransactionDetail:
      type: object
      properties:
        transactionId:
          type: string
        date:
          type: string
          format: date-time
        merchant:
          type: string
        amount:
          type: number
          format: double
        transactionType:
          type: string
          enum: [debit, credit]
      required: [transactionId, date, merchant, amount, transactionType]
    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalRecords:
          type: integer
      required: [page, pageSize, totalRecords]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required: [error]
  responses:
    BadRequest:
      description: Invalid request parameters or data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized access
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Resource not found
    Conflict:
      description: Conflict (e.g. duplicate or concurrent update)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Conflict
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Internal server error
