<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG Output: C4 Container Diagram - Parent-Youth Account Management -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <g>
    <rect x="20" y="20" width="860" height="660" fill="#f8f8f8" stroke="#bbb" stroke-width="2" rx="20"/>
    <text x="450" y="55" font-size="24" font-family="Verdana" text-anchor="middle" font-weight="bold">Parent-Youth Account Management - Component Diagram</text>
    <!-- Web/Mobile App -->
    <rect x="60" y="100" width="200" height="80" fill="#e6f7ff" stroke="#007acc" stroke-width="2" rx="10"/>
    <text x="160" y="140" font-size="16" font-family="Verdana" text-anchor="middle">Web/Mobile App</text>
    <!-- API Gateway -->
    <rect x="340" y="100" width="200" height="80" fill="#fffbe6" stroke="#faad14" stroke-width="2" rx="10"/>
    <text x="440" y="140" font-size="16" font-family="Verdana" text-anchor="middle">API Gateway</text>
    <!-- Youth Account API -->
    <rect x="620" y="100" width="200" height="80" fill="#f6ffed" stroke="#52c41a" stroke-width="2" rx="10"/>
    <text x="720" y="140" font-size="16" font-family="Verdana" text-anchor="middle">Youth Account API</text>
    <!-- Payment Service -->
    <rect x="200" y="250" width="200" height="80" fill="#fff0f6" stroke="#eb2f96" stroke-width="2" rx="10"/>
    <text x="300" y="290" font-size="16" font-family="Verdana" text-anchor="middle">Payment Service</text>
    <!-- Transaction Service -->
    <rect x="500" y="250" width="200" height="80" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" rx="10"/>
    <text x="600" y="290" font-size="16" font-family="Verdana" text-anchor="middle">Transaction Service</text>
    <!-- Database -->
    <rect x="350" y="400" width="200" height="80" fill="#fff1b8" stroke="#d48806" stroke-width="2" rx="10"/>
    <text x="450" y="440" font-size="16" font-family="Verdana" text-anchor="middle">Database (PostgreSQL)</text>
    <!-- OAuth Server -->
    <rect x="750" y="400" width="120" height="60" fill="#e6fffb" stroke="#13c2c2" stroke-width="2" rx="10"/>
    <text x="810" y="435" font-size="14" font-family="Verdana" text-anchor="middle">OAuth Server</text>
    <!-- Connectors -->
    <line x1="260" y1="140" x2="340" y2="140" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="540" y1="140" x2="620" y2="140" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="720" y1="180" x2="720" y2="250" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="440" y1="180" x2="440" y2="250" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="540" y1="290" x2="600" y2="290" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="400" y1="330" x2="450" y2="400" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="650" y1="330" x2="450" y2="400" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="720" y1="180" x2="810" y2="400" stroke="#13c2c2" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" />
    <!-- Arrow marker -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#aaa" />
      </marker>
    </defs>
  </g>
</svg>
