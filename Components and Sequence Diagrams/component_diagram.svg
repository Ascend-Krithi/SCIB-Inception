<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG: Youth Account Management Component Diagram -->
<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Arial, Helvetica, sans-serif" font-size="16">
    <!-- Parent/Guardian -->
    <rect x="60" y="60" width="180" height="60" rx="10" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
    <text x="150" y="95" text-anchor="middle">Parent/Guardian</text>
    <!-- UI -->
    <rect x="280" y="60" width="200" height="60" rx="10" fill="#e8f0fe" stroke="#333" stroke-width="2"/>
    <text x="380" y="95" text-anchor="middle">Parent Dashboard UI (React SPA)</text>
    <!-- API -->
    <rect x="520" y="60" width="200" height="60" rx="10" fill="#d1f5e0" stroke="#333" stroke-width="2"/>
    <text x="620" y="95" text-anchor="middle">Youth Account API (Spring Boot)</text>
    <!-- OAuth Service -->
    <rect x="280" y="160" width="180" height="60" rx="10" fill="#ffe0b2" stroke="#333" stroke-width="2"/>
    <text x="370" y="195" text-anchor="middle">OAuth Service</text>
    <!-- Account Service -->
    <rect x="520" y="160" width="180" height="60" rx="10" fill="#f8bbd0" stroke="#333" stroke-width="2"/>
    <text x="610" y="195" text-anchor="middle">Account Service</text>
    <!-- Transaction Service -->
    <rect x="60" y="260" width="180" height="60" rx="10" fill="#b3e5fc" stroke="#333" stroke-width="2"/>
    <text x="150" y="295" text-anchor="middle">Transaction Service</text>
    <!-- Payment Service -->
    <rect x="280" y="260" width="180" height="60" rx="10" fill="#c8e6c9" stroke="#333" stroke-width="2"/>
    <text x="370" y="295" text-anchor="middle">Payment Service</text>
    <!-- Youth Account DB -->
    <ellipse cx="710" cy="300" rx="70" ry="30" fill="#fff9c4" stroke="#333" stroke-width="2"/>
    <text x="710" y="305" text-anchor="middle">Youth Account DB</text>
    <!-- Lines -->
    <line x1="240" y1="90" x2="280" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="480" y1="90" x2="520" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="380" y1="120" x2="370" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="620" y1="120" x2="610" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="620" y1="120" x2="710" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="620" y1="120" x2="370" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="620" y1="120" x2="150" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="370" y1="320" x2="710" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="610" y1="220" x2="710" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#333" />
      </marker>
    </defs>
  </g>
</svg>