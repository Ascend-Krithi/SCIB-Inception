<?xml version="1.0" encoding="UTF-8"?>
<!-- SVG Export of Mermaid C4 Container Diagram for Youth Account Management -->
<svg width="950" height="650" viewBox="0 0 950 650" xmlns="http://www.w3.org/2000/svg">
  <g font-family="monospace" font-size="15">
    <!-- Banking Web App -->
    <rect x="40" y="60" width="220" height="80" fill="#cce6ff" stroke="#003366" stroke-width="2" rx="10"/>
    <text x="55" y="95">Banking Web App</text>
    <text x="55" y="115" font-size="13">SPA/React</text>
    <!-- Youth Account API -->
    <rect x="320" y="60" width="220" height="80" fill="#e6ffe6" stroke="#006633" stroke-width="2" rx="10"/>
    <text x="335" y="95">Youth Account API</text>
    <text x="335" y="115" font-size="13">Node.js/Java Spring</text>
    <!-- Youth Account DB -->
    <rect x="600" y="60" width="220" height="80" fill="#fff5cc" stroke="#b38600" stroke-width="2" rx="10"/>
    <text x="615" y="95">Youth Account DB</text>
    <text x="615" y="115" font-size="13">PostgreSQL</text>
    <!-- Account Service -->
    <rect x="320" y="200" width="220" height="80" fill="#f2e6ff" stroke="#660099" stroke-width="2" rx="10"/>
    <text x="335" y="235">Account Service</text>
    <text x="335" y="255" font-size="13">Core banking</text>
    <!-- Transaction Ledger Service -->
    <rect x="600" y="200" width="220" height="80" fill="#f9e6e6" stroke="#cc0000" stroke-width="2" rx="10"/>
    <text x="615" y="235">Transaction Ledger Service</text>
    <text x="615" y="255" font-size="13">Records transactions</text>
    <!-- Connections -->
    <line x1="260" y1="100" x2="320" y2="100" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="540" y1="100" x2="600" y2="100" stroke="#006633" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="430" y1="140" x2="430" y2="200" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="540" y1="100" x2="430" y2="200" stroke="#660099" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="820" y1="100" x2="710" y2="200" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Arrowhead definition -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#222" />
      </marker>
    </defs>
  </g>
  <!-- Legend -->
  <g font-family="monospace" font-size="13">
    <rect x="40" y="320" width="820" height="110" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="8"/>
    <text x="55" y="345">Legend:</text>
    <text x="70" y="365">Banking Web App: Parent UI (SPA/React)</text>
    <text x="70" y="385">Youth Account API: REST (Node.js/Java Spring)</text>
    <text x="70" y="405">Youth Account DB: PostgreSQL</text>
    <text x="70" y="425">Account Service: Core banking integration</text>
    <text x="70" y="445">Transaction Ledger Service: Records transactions</text>
  </g>
</svg>
