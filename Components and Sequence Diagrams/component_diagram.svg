<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG for C4 Container Diagram: Youth Account Management -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920">
  <rect x="20" y="20" width="1240" height="880" rx="20" fill="#f8faff" stroke="#1a237e" stroke-width="3"/>
  <text x="640" y="60" text-anchor="middle" font-size="32" fill="#1a237e" font-family="Arial">Youth Account Management - Component Diagram</text>
  <!-- Web/Mobile UI -->
  <rect x="80" y="120" width="220" height="80" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="190" y="165" text-anchor="middle" font-size="18" fill="#1976d2">Web/Mobile UI</text>
  <text x="190" y="185" text-anchor="middle" font-size="13" fill="#1976d2">(React/Angular)</text>
  <!-- API Gateway -->
  <rect x="350" y="120" width="220" height="80" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="460" y="165" text-anchor="middle" font-size="18" fill="#1976d2">API Gateway</text>
  <text x="460" y="185" text-anchor="middle" font-size="13" fill="#1976d2">(Spring Cloud Gateway)</text>
  <!-- Youth Service -->
  <rect x="620" y="120" width="220" height="80" rx="10" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="730" y="165" text-anchor="middle" font-size="18" fill="#fbc02d">Youth Service</text>
  <text x="730" y="185" text-anchor="middle" font-size="13" fill="#fbc02d">(Java/Spring Boot)</text>
  <!-- Settings Service -->
  <rect x="890" y="120" width="220" height="80" rx="10" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="1000" y="165" text-anchor="middle" font-size="18" fill="#fbc02d">Settings Service</text>
  <text x="1000" y="185" text-anchor="middle" font-size="13" fill="#fbc02d">(Java/Spring Boot)</text>
  <!-- Transaction Service Proxy -->
  <rect x="620" y="270" width="220" height="80" rx="10" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="730" y="315" text-anchor="middle" font-size="18" fill="#fbc02d">Transaction Service Proxy</text>
  <text x="730" y="335" text-anchor="middle" font-size="13" fill="#fbc02d">(Java/Spring Boot)</text>
  <!-- Youth DB -->
  <rect x="350" y="270" width="220" height="80" rx="10" fill="#ede7f6" stroke="#512da8" stroke-width="2"/>
  <text x="460" y="315" text-anchor="middle" font-size="18" fill="#512da8">Youth DB</text>
  <text x="460" y="335" text-anchor="middle" font-size="13" fill="#512da8">(PostgreSQL)</text>
  <!-- Core Banking (External) -->
  <rect x="80" y="420" width="220" height="80" rx="10" fill="#e0f7fa" stroke="#0097a7" stroke-width="2"/>
  <text x="190" y="465" text-anchor="middle" font-size="18" fill="#0097a7">Core Banking</text>
  <text x="190" y="485" text-anchor="middle" font-size="13" fill="#0097a7">(Mainframe/Service)</text>
  <!-- OAuth Service (External) -->
  <rect x="350" y="420" width="220" height="80" rx="10" fill="#e0f7fa" stroke="#0097a7" stroke-width="2"/>
  <text x="460" y="465" text-anchor="middle" font-size="18" fill="#0097a7">OAuth Service</text>
  <text x="460" y="485" text-anchor="middle" font-size="13" fill="#0097a7">(Keycloak/SSO)</text>
  <!-- Notification Service (External) -->
  <rect x="890" y="420" width="220" height="80" rx="10" fill="#e0f7fa" stroke="#0097a7" stroke-width="2"/>
  <text x="1000" y="465" text-anchor="middle" font-size="18" fill="#0097a7">Notification Service</text>
  <text x="1000" y="485" text-anchor="middle" font-size="13" fill="#0097a7">(Alerts/Notifications)</text>
  <!-- Arrows -->
  <g stroke="#424242" stroke-width="2" marker-end="url(#arrow)">
    <line x1="300" y1="160" x2="350" y2="160"/> <!-- Web UI -> API GW -->
    <line x1="570" y1="160" x2="620" y2="160"/> <!-- API GW -> Youth S -->
    <line x1="840" y1="160" x2="890" y2="160"/> <!-- Youth S -> Settings S -->
    <line x1="730" y1="200" x2="730" y2="270"/> <!-- Youth S -> Txn S -->
    <line x1="460" y1="200" x2="460" y2="270"/> <!-- API GW -> Youth DB -->
    <line x1="730" y1="350" x2="190" y2="420"/> <!-- Txn S -> CoreBank -->
    <line x1="460" y1="200" x2="460" y2="420"/> <!-- API GW -> OAuth -->
    <line x1="730" y1="200" x2="1000" y2="420"/> <!-- Youth S -> Notification -->
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#424242" />
    </marker>
  </defs>
</svg>
