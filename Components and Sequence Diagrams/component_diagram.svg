<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG Export: C4 Container/Component View for Youth Account Management -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <g font-family="Arial" font-size="18">
    <!-- System Boundary -->
    <rect x="20" y="20" width="1060" height="610" fill="#f8f8ff" stroke="#222" stroke-width="2" rx="16"/>
    <text x="540" y="50" text-anchor="middle" font-size="22" font-weight="bold">Banking Application (System)</text>
    <!-- Web Frontend -->
    <rect x="70" y="100" width="200" height="80" fill="#cce5ff" stroke="#0366d6" stroke-width="2" rx="10"/>
    <text x="170" y="145" text-anchor="middle">Web Frontend</text>
    <text x="170" y="165" text-anchor="middle" font-size="14">React/Angular</text>
    <!-- API Gateway -->
    <rect x="340" y="100" width="200" height="80" fill="#e6f7ff" stroke="#17a2b8" stroke-width="2" rx="10"/>
    <text x="440" y="145" text-anchor="middle">API Gateway</text>
    <text x="440" y="165" text-anchor="middle" font-size="14">REST</text>
    <!-- Youth Account Service -->
    <rect x="610" y="100" width="200" height="80" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="10"/>
    <text x="710" y="145" text-anchor="middle">Youth Account Service</text>
    <text x="710" y="165" text-anchor="middle" font-size="14">Java/Spring</text>
    <!-- Auth Service -->
    <rect x="880" y="100" width="180" height="80" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="10"/>
    <text x="970" y="145" text-anchor="middle">Auth Service</text>
    <text x="970" y="165" text-anchor="middle" font-size="14">OAuth2</text>
    <!-- External Services -->
    <rect x="340" y="250" width="200" height="70" fill="#f8d7da" stroke="#dc3545" stroke-width="2" rx="10"/>
    <text x="440" y="290" text-anchor="middle">Account Service (Ext)</text>
    <rect x="610" y="250" width="200" height="70" fill="#f8d7da" stroke="#dc3545" stroke-width="2" rx="10"/>
    <text x="710" y="290" text-anchor="middle">Transaction Service (Ext)</text>
    <rect x="880" y="250" width="180" height="70" fill="#f8d7da" stroke="#dc3545" stroke-width="2" rx="10"/>
    <text x="970" y="290" text-anchor="middle">Payment Service (Ext)</text>
    <!-- Database -->
    <rect x="610" y="380" width="200" height="60" fill="#e2e3e5" stroke="#6c757d" stroke-width="2" rx="10"/>
    <text x="710" y="410" text-anchor="middle">Youth Account DB (PostgreSQL)</text>
    <!-- Arrows -->
    <g stroke="#222" stroke-width="2" fill="none">
      <!-- Web -> API Gateway -->
      <line x1="270" y1="140" x2="340" y2="140" marker-end="url(#arrow)"/>
      <!-- API Gateway -> Youth Account Service -->
      <line x1="540" y1="140" x2="610" y2="140" marker-end="url(#arrow)"/>
      <!-- API Gateway -> Auth Service -->
      <line x1="540" y1="180" x2="880" y2="180" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
      <!-- Youth Account Service -> Account Service -->
      <line x1="710" y1="180" x2="440" y2="250" marker-end="url(#arrow)"/>
      <!-- Youth Account Service -> Transaction Service -->
      <line x1="710" y1="180" x2="710" y2="250" marker-end="url(#arrow)"/>
      <!-- Youth Account Service -> Payment Service -->
      <line x1="710" y1="180" x2="970" y2="250" marker-end="url(#arrow)"/>
      <!-- Youth Account Service -> Youth Account DB -->
      <line x1="710" y1="180" x2="710" y2="380" marker-end="url(#arrow)"/>
    </g>
    <!-- Arrow Marker -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#222" />
      </marker>
    </defs>
    <!-- Legend -->
    <rect x="20" y="560" width="350" height="60" fill="#fff" stroke="#222" stroke-width="1" rx="8"/>
    <text x="35" y="585" font-size="14">Legend:</text>
    <text x="35" y="605" font-size="14">Solid arrows: Synchronous REST calls</text>
    <text x="250" y="605" font-size="14">Dashed: Auth token validation</text>
  </g>
</svg>
