<!-- Mermaid SVG for Component Diagram (exported from mermaid) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <g>
    <rect x="30" y="40" width="220" height="70" rx="10" fill="#e6f0fa" stroke="#003366" stroke-width="2"/>
    <text x="55" y="75" font-size="18" fill="#003366">Parent/Guardian (Actor)</text>
    <rect x="300" y="40" width="220" height="70" rx="10" fill="#e6f0fa" stroke="#003366" stroke-width="2"/>
    <text x="325" y="75" font-size="18" fill="#003366">Youth Account Dashboard UI</text>
    <rect x="570" y="40" width="260" height="70" rx="10" fill="#e6f0fa" stroke="#003366" stroke-width="2"/>
    <text x="590" y="75" font-size="18" fill="#003366">Youth Account Management API</text>
    <rect x="300" y="180" width="180" height="60" rx="10" fill="#fffbe6" stroke="#b8860b" stroke-width="2"/>
    <text x="320" y="215" font-size="16" fill="#b8860b">Account Service</text>
    <rect x="500" y="180" width="180" height="60" rx="10" fill="#fffbe6" stroke="#b8860b" stroke-width="2"/>
    <text x="520" y="215" font-size="16" fill="#b8860b">Transaction Service</text>
    <rect x="700" y="180" width="180" height="60" rx="10" fill="#fffbe6" stroke="#b8860b" stroke-width="2"/>
    <text x="720" y="215" font-size="16" fill="#b8860b">Payment Service</text>
    <rect x="570" y="320" width="200" height="60" rx="10" fill="#e6ffe6" stroke="#228b22" stroke-width="2"/>
    <text x="590" y="355" font-size="16" fill="#228b22">Youth Account Settings DB</text>
    <!-- Arrows -->
    <line x1="250" y1="75" x2="300" y2="75" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="75" x2="570" y2="75" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="700" y1="75" x2="700" y2="180" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="690" y1="110" x2="390" y2="180" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="760" y1="110" x2="590" y2="180" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="830" y1="110" x2="880" y2="180" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="700" y1="110" x2="670" y2="320" stroke="#228b22" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Arrow marker -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#003366" />
      </marker>
    </defs>
    <!-- Compliance and Security -->
    <text x="50" y="420" font-size="15" fill="#003366">Security: OAuth2, RBAC, Audit Logging</text>
    <text x="50" y="445" font-size="15" fill="#003366">Compliance: GDPR, PCI-DSS, ISO 27001</text>
    <text x="50" y="470" font-size="15" fill="#003366">Traceability: All actions logged</text>
  </g>
</svg>