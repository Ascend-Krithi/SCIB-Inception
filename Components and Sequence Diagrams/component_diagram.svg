<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Mermaid SVG: C4 Container Diagram for Youth Account Management -->
<svg width="900" height="540" viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <!-- Web/Mobile App -->
  <rect x="50" y="80" width="160" height="60" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="130" y="110" font-size="14" text-anchor="middle" fill="#0d47a1">Web/Mobile App</text>
  <text x="130" y="125" font-size="12" text-anchor="middle" fill="#1976d2">React/Angular/Flutter</text>
  <!-- API Gateway -->
  <rect x="250" y="80" width="160" height="60" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="330" y="110" font-size="14" text-anchor="middle" fill="#e65100">API Gateway</text>
  <text x="330" y="125" font-size="12" text-anchor="middle" fill="#ef6c00">Spring Cloud Gateway</text>
  <!-- Youth Account Service -->
  <rect x="470" y="60" width="200" height="70" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="570" y="95" font-size="14" text-anchor="middle" fill="#1b5e20">Youth Account Service</text>
  <text x="570" y="110" font-size="12" text-anchor="middle" fill="#388e3c">Java/Spring Boot</text>
  <!-- Payment Service -->
  <rect x="470" y="180" width="200" height="60" rx="10" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="570" y="210" font-size="14" text-anchor="middle" fill="#f57f17">Payment Service</text>
  <text x="570" y="225" font-size="12" text-anchor="middle" fill="#fbc02d">Java/Spring Boot</text>
  <!-- Transaction Service -->
  <rect x="470" y="270" width="200" height="60" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="570" y="300" font-size="14" text-anchor="middle" fill="#4a148c">Transaction Service</text>
  <text x="570" y="315" font-size="12" text-anchor="middle" fill="#8e24aa">Java/Spring Boot</text>
  <!-- Database -->
  <rect x="750" y="140" width="120" height="120" rx="15" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <text x="810" y="180" font-size="14" text-anchor="middle" fill="#263238">Database</text>
  <text x="810" y="200" font-size="12" text-anchor="middle" fill="#37474f">PostgreSQL</text>
  <!-- Connections -->
  <line x1="210" y1="110" x2="250" y2="110" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="110" x2="470" y2="95" stroke="#ef6c00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="95" x2="750" y2="180" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="210" x2="750" y2="180" stroke="#fbc02d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="300" x2="750" y2="180" stroke="#8e24aa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="130" x2="570" y2="180" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="240" x2="570" y2="270" stroke="#fbc02d" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238" />
    </marker>
  </defs>
  <!-- Legend -->
  <rect x="50" y="380" width="800" height="120" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" rx="10"/>
  <text x="450" y="410" font-size="16" text-anchor="middle" fill="#37474f">Legend</text>
  <text x="70" y="435" font-size="13" fill="#1976d2">Web/Mobile App</text>
  <text x="230" y="435" font-size="13" fill="#ef6c00">API Gateway</text>
  <text x="400" y="435" font-size="13" fill="#388e3c">Youth Account Service</text>
  <text x="600" y="435" font-size="13" fill="#fbc02d">Payment Service</text>
  <text x="730" y="435" font-size="13" fill="#8e24aa">Transaction Service</text>
  <text x="850" y="435" font-size="13" fill="#37474f">Database</text>
  <text x="450" y="465" font-size="12" text-anchor="middle" fill="#607d8b">Arrows indicate REST/JDBC calls (directional)</text>
  <text x="450" y="485" font-size="12" text-anchor="middle" fill="#607d8b">Security: OAuth 2.0, RBAC enforced at API Gateway and Service layers</text>
  <text x="450" y="505" font-size="12" text-anchor="middle" fill="#607d8b">Compliance: GDPR, PCI-DSS, ISO 27001; Logging/Auditing at all critical paths</text>
</svg>