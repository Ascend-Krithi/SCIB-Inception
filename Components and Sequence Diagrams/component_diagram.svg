<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid C4-style Component Diagram SVG for Youth Account Management -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <!-- Web UI -->
  <rect x="50" y="60" width="180" height="80" fill="#e6f7ff" stroke="#1890ff" stroke-width="2" rx="10"/>
  <text x="140" y="100" font-size="16" text-anchor="middle" fill="#1890ff">Web UI (React/Angular)</text>
  <!-- API -->
  <rect x="260" y="60" width="220" height="80" fill="#fffbe6" stroke="#faad14" stroke-width="2" rx="10"/>
  <text x="370" y="100" font-size="16" text-anchor="middle" fill="#faad14">Youth Account Management API (Spring Boot)</text>
  <!-- DB -->
  <rect x="530" y="60" width="170" height="80" fill="#f6ffed" stroke="#52c41a" stroke-width="2" rx="10"/>
  <text x="615" y="100" font-size="16" text-anchor="middle" fill="#52c41a">Youth Account DB (PostgreSQL)</text>
  <!-- Account Service -->
  <rect x="260" y="200" width="170" height="60" fill="#fff0f6" stroke="#eb2f96" stroke-width="2" rx="10"/>
  <text x="345" y="235" font-size="14" text-anchor="middle" fill="#eb2f96">Account Service</text>
  <!-- Transaction Service -->
  <rect x="450" y="200" width="170" height="60" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" rx="10"/>
  <text x="535" y="235" font-size="14" text-anchor="middle" fill="#722ed1">Transaction Service</text>
  <!-- Payment Service -->
  <rect x="640" y="200" width="170" height="60" fill="#fff1f0" stroke="#f5222d" stroke-width="2" rx="10"/>
  <text x="725" y="235" font-size="14" text-anchor="middle" fill="#f5222d">Payment Service</text>
  <!-- Arrows -->
  <!-- UI -> API -->
  <line x1="230" y1="100" x2="260" y2="100" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- API -> DB -->
  <line x1="480" y1="100" x2="530" y2="100" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- API -> Account Service -->
  <line x1="370" y1="140" x2="345" y2="200" stroke="#eb2f96" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- API -> Transaction Service -->
  <line x1="370" y1="140" x2="535" y2="200" stroke="#722ed1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- API -> Payment Service -->
  <line x1="480" y1="140" x2="725" y2="200" stroke="#f5222d" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- SVG Arrowhead Definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#000" />
    </marker>
  </defs>
</svg>
