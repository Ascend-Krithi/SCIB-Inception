<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG Export: Youth Account Management Component Diagram (C4) -->
<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Arial, sans-serif" font-size="16">
    <!-- Banking Web Application -->
    <rect x="50" y="70" width="180" height="60" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="10"/>
    <text x="65" y="100">Banking Web Application</text>
    <!-- API Gateway -->
    <rect x="280" y="70" width="150" height="60" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="10"/>
    <text x="295" y="100">API Gateway</text>
    <!-- Youth Account API Service -->
    <rect x="480" y="70" width="220" height="60" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="10"/>
    <text x="495" y="100">Youth Account API Service</text>
    <!-- Settings DB -->
    <rect x="480" y="180" width="120" height="50" fill="#FFFDE7" stroke="#FBC02D" stroke-width="2" rx="8"/>
    <text x="495" y="210">Settings DB</text>
    <!-- Transaction DB -->
    <rect x="620" y="180" width="130" height="50" fill="#E1F5FE" stroke="#0288D1" stroke-width="2" rx="8"/>
    <text x="635" y="210">Transaction DB</text>
    <!-- Account Service (External) -->
    <rect x="50" y="300" width="170" height="50" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2" rx="8"/>
    <text x="65" y="330">Account Service</text>
    <!-- Payment Service (External) -->
    <rect x="280" y="300" width="170" height="50" fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="8"/>
    <text x="295" y="330">Payment Service</text>
    <!-- Transaction Ledger Service (External) -->
    <rect x="530" y="300" width="200" height="50" fill="#E0F2F1" stroke="#00897B" stroke-width="2" rx="8"/>
    <text x="545" y="330">Transaction Ledger Service</text>
    <!-- Connections -->
    <line x1="230" y1="100" x2="280" y2="100" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="430" y1="100" x2="480" y2="100" stroke="#F57C00" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="590" y1="130" x2="540" y2="180" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="650" y1="130" x2="700" y2="180" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="480" y1="100" x2="135" y2="300" stroke="#8E24AA" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="480" y1="100" x2="365" y2="300" stroke="#C62828" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="700" y1="130" x2="630" y2="300" stroke="#00897B" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
</svg>
