<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG: Component Diagram for Parent-Youth Account Management -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <g>
    <!-- Web Application -->
    <rect x="50" y="100" width="170" height="60" fill="#f6f7fb" stroke="#222" rx="8"/>
    <text x="135" y="130" text-anchor="middle" font-size="15" font-weight="bold">Banking Web App</text>
    <text x="135" y="145" text-anchor="middle" font-size="12">SPA/React (UI)</text>
    <!-- Youth Account APIs -->
    <rect x="270" y="100" width="180" height="60" fill="#e0f7fa" stroke="#222" rx="8"/>
    <text x="360" y="130" text-anchor="middle" font-size="15" font-weight="bold">Youth Account APIs</text>
    <text x="360" y="145" text-anchor="middle" font-size="12">REST API</text>
    <!-- Settings DB -->
    <rect x="500" y="100" width="170" height="60" fill="#fff3e0" stroke="#222" rx="8"/>
    <text x="585" y="130" text-anchor="middle" font-size="15" font-weight="bold">Settings DB</text>
    <text x="585" y="145" text-anchor="middle" font-size="12">PostgreSQL</text>
    <!-- Account Service -->
    <rect x="270" y="220" width="170" height="60" fill="#e8f5e9" stroke="#222" rx="8"/>
    <text x="355" y="250" text-anchor="middle" font-size="15" font-weight="bold">Account Service</text>
    <text x="355" y="265" text-anchor="middle" font-size="12">REST</text>
    <!-- Transaction Service -->
    <rect x="500" y="220" width="170" height="60" fill="#ede7f6" stroke="#222" rx="8"/>
    <text x="585" y="250" text-anchor="middle" font-size="15" font-weight="bold">Transaction Service</text>
    <text x="585" y="265" text-anchor="middle" font-size="12">REST</text>
    <!-- Payment Service -->
    <rect x="730" y="220" width="120" height="60" fill="#fff9c4" stroke="#222" rx="8"/>
    <text x="790" y="250" text-anchor="middle" font-size="15" font-weight="bold">Payment Service</text>
    <text x="790" y="265" text-anchor="middle" font-size="12">REST</text>
    <!-- Arrows -->
    <g stroke="#222" stroke-width="2" marker-end="url(#arrow)">
      <!-- UI to API -->
      <line x1="220" y1="130" x2="270" y2="130" />
      <!-- API to Settings DB -->
      <line x1="450" y1="130" x2="500" y2="130" />
      <!-- API to Account Service -->
      <line x1="360" y1="160" x2="360" y2="220" />
      <!-- API to Transaction Service -->
      <line x1="450" y1="160" x2="585" y2="220" />
      <!-- API to Payment Service -->
      <line x1="450" y1="130" x2="730" y2="250" />
    </g>
    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#222" />
      </marker>
    </defs>
    <!-- Legend -->
    <rect x="50" y="350" width="350" height="110" fill="#fafafa" stroke="#888" rx="8"/>
    <text x="225" y="375" text-anchor="middle" font-size="14" font-weight="bold">Legend</text>
    <text x="70" y="395" font-size="12">UI/API:</text>
    <rect x="120" y="385" width="20" height="12" fill="#f6f7fb" stroke="#222"/>
    <text x="70" y="415" font-size="12">API:</text>
    <rect x="120" y="405" width="20" height="12" fill="#e0f7fa" stroke="#222"/>
    <text x="70" y="435" font-size="12">DB:</text>
    <rect x="120" y="425" width="20" height="12" fill="#fff3e0" stroke="#222"/>
    <text x="70" y="455" font-size="12">External Service:</text>
    <rect x="170" y="445" width="20" height="12" fill="#e8f5e9" stroke="#222"/>
    <rect x="200" y="445" width="20" height="12" fill="#ede7f6" stroke="#222"/>
    <rect x="230" y="445" width="20" height="12" fill="#fff9c4" stroke="#222"/>
  </g>
</svg>
