<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mermaid C4-style Component Diagram for Parent-Youth Account Management
  (exported as SVG)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <rect x="20" y="40" width="860" height="540" fill="#FAFAFA" stroke="#222" stroke-width="2" rx="16"/>
  <!-- Web UI -->
  <rect x="60" y="100" width="180" height="80" fill="#AEE9F5" stroke="#111" stroke-width="2" rx="10"/>
  <text x="150" y="145" font-size="18" text-anchor="middle" fill="#111">Web UI</text>
  <text x="150" y="165" font-size="13" text-anchor="middle" fill="#333">React/Angular</text>
  <!-- API Gateway -->
  <rect x="270" y="100" width="180" height="80" fill="#F9F6A7" stroke="#111" stroke-width="2" rx="10"/>
  <text x="360" y="145" font-size="18" text-anchor="middle" fill="#111">API Gateway</text>
  <text x="360" y="165" font-size="13" text-anchor="middle" fill="#333">Spring Boot/Node.js</text>
  <!-- Youth Account Service -->
  <rect x="480" y="100" width="200" height="80" fill="#B7F5B6" stroke="#111" stroke-width="2" rx="10"/>
  <text x="580" y="145" font-size="18" text-anchor="middle" fill="#111">Youth Account Service</text>
  <text x="580" y="165" font-size="13" text-anchor="middle" fill="#333">Java/.NET</text>
  <!-- Settings DB -->
  <rect x="720" y="100" width="120" height="80" fill="#E7D3F9" stroke="#111" stroke-width="2" rx="10"/>
  <text x="780" y="145" font-size="16" text-anchor="middle" fill="#111">Settings DB</text>
  <text x="780" y="165" font-size="12" text-anchor="middle" fill="#333">PostgreSQL</text>
  <!-- Core Banking System -->
  <rect x="480" y="250" width="160" height="70" fill="#F5B6B6" stroke="#111" stroke-width="2" rx="10"/>
  <text x="560" y="290" font-size="16" text-anchor="middle" fill="#111">Core Banking System</text>
  <!-- Transaction Ledger Service -->
  <rect x="670" y="250" width="170" height="70" fill="#B6D6F5" stroke="#111" stroke-width="2" rx="10"/>
  <text x="755" y="290" font-size="16" text-anchor="middle" fill="#111">Transaction Ledger</text>
  <!-- Arrows -->
  <line x1="240" y1="140" x2="270" y2="140" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="140" x2="480" y2="140" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="140" x2="720" y2="140" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="180" x2="580" y2="250" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="180" x2="755" y2="250" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#222" />
    </marker>
  </defs>
  <!-- Legend -->
  <rect x="40" y="420" width="820" height="120" fill="#FFF" stroke="#AAA" stroke-width="1" rx="10"/>
  <text x="450" y="450" font-size="16" text-anchor="middle" fill="#111">Legend: Data Flows</text>
  <text x="60" y="470" font-size="13" fill="#111">Web UI → API Gateway: HTTPS (OAuth2, RBAC)</text>
  <text x="60" y="490" font-size="13" fill="#111">API Gateway → Youth Account Service: REST (token validated, audit logged)</text>
  <text x="60" y="510" font-size="13" fill="#111">Youth Account Service → Core Banking/Transaction Ledger/Settings DB: JDBC/REST</text>
  <text x="60" y="530" font-size="13" fill="#111">Compliance: GDPR, PCI-DSS, ISO 27001 | Logging: Centralized | RBAC enforced</text>
</svg>