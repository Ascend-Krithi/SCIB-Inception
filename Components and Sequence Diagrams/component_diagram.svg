<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid C4 Component Diagram for Youth Account Management (SVG export) -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <rect x="40" y="40" width="800" height="520" rx="20" ry="20" fill="#f9f9f9" stroke="#444" stroke-width="2"/>
  <!-- Web Application Boundary -->
  <rect x="80" y="80" width="340" height="200" rx="10" ry="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="110" y="105" font-size="18" fill="#1976d2">Banking Web Application</text>
  <!-- UI Component -->
  <rect x="100" y="130" width="120" height="60" rx="8" ry="8" fill="#fff" stroke="#42a5f5" stroke-width="2"/>
  <text x="115" y="160" font-size="14" fill="#1976d2">Web UI (React)</text>
  <!-- API Component -->
  <rect x="240" y="130" width="160" height="60" rx="8" ry="8" fill="#fff" stroke="#42a5f5" stroke-width="2"/>
  <text x="255" y="160" font-size="14" fill="#1976d2">Youth Account API (Spring Boot)</text>
  <!-- Youth Account DB -->
  <ellipse cx="320" cy="260" rx="60" ry="30" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="270" y="265" font-size="14" fill="#fbc02d">Youth Account DB (RDS)</text>
  <!-- External Services -->
  <rect x="480" y="100" width="160" height="50" rx="8" ry="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="495" y="130" font-size="14" fill="#388e3c">Account Service</text>
  <rect x="480" y="170" width="160" height="50" rx="8" ry="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="495" y="200" font-size="14" fill="#388e3c">Payment Service</text>
  <rect x="480" y="240" width="160" height="50" rx="8" ry="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="495" y="270" font-size="14" fill="#388e3c">Transaction Service</text>
  <!-- Connections -->
  <line x1="160" y1="190" x2="240" y2="160" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="190" x2="320" y2="230" stroke="#fbc02d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="160" x2="480" y2="125" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="160" x2="480" y2="195" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="160" x2="480" y2="265" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#444"/>
    </marker>
  </defs>
</svg>
