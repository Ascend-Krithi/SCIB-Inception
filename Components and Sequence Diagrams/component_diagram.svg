<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="650" xmlns="http://www.w3.org/2000/svg">
  <desc>Component Diagram: Youth Account Management Solution - Microservices, API Gateway, Auth, Integrations, Compliance</desc>
  <g font-family="monospace" font-size="16">
    <!-- System Boundary -->
    <rect x="40" y="60" width="1120" height="420" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="60" y="85" font-size="18" font-weight="bold">Banking Web Application (System Boundary)</text>
    <!-- Web UI -->
    <rect x="80" y="120" width="180" height="60" fill="#fff" stroke="#1976d2" stroke-width="2"/>
    <text x="95" y="150">Web UI</text>
    <text x="95" y="170" font-size="13">React/Angular</text>
    <!-- API Gateway -->
    <rect x="300" y="120" width="180" height="60" fill="#fff" stroke="#1976d2" stroke-width="2"/>
    <text x="315" y="150">API Gateway</text>
    <text x="315" y="170" font-size="13">Spring Cloud Gateway</text>
    <!-- Youth Account Service -->
    <rect x="520" y="120" width="220" height="60" fill="#fff" stroke="#1976d2" stroke-width="2"/>
    <text x="535" y="150">Youth Account Service</text>
    <text x="535" y="170" font-size="13">Java/Spring Boot</text>
    <!-- Auth Service -->
    <rect x="780" y="120" width="180" height="60" fill="#fff" stroke="#1976d2" stroke-width="2"/>
    <text x="795" y="150">Auth Service</text>
    <text x="795" y="170" font-size="13">OAuth 2.0 Server</text>
    <!-- Core Banking Integration -->
    <rect x="1040" y="90" width="120" height="60" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
    <text x="1055" y="120">Core Banking</text>
    <!-- Transaction Service Integration -->
    <rect x="1040" y="180" width="120" height="60" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
    <text x="1055" y="210">Transaction Service</text>
    <!-- Flows -->
    <!-- Web UI -> API Gateway -->
    <line x1="260" y1="150" x2="300" y2="150" stroke="#1976d2" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="270" y="140" font-size="12">REST</text>
    <!-- API Gateway -> Youth Account Service -->
    <line x1="480" y1="150" x2="520" y2="150" stroke="#1976d2" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="490" y="140" font-size="12">REST</text>
    <!-- API Gateway -> Auth Service -->
    <line x1="390" y1="180" x2="780" y2="180" stroke="#1976d2" stroke-dasharray="8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="540" y="195" font-size="12">Token Validation</text>
    <!-- Youth Account Service -> Core Banking -->
    <line x1="740" y1="150" x2="1040" y2="120" stroke="#fbc02d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="900" y="130" font-size="12">Account/Fund APIs</text>
    <!-- Youth Account Service -> Transaction Service -->
    <line x1="740" y1="170" x2="1040" y2="210" stroke="#fbc02d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="900" y="200" font-size="12">Transaction Queries</text>
    <!-- Parent/Guardian -->
    <rect x="80" y="240" width="120" height="50" fill="#fce4ec" stroke="#d81b60" stroke-width="2"/>
    <text x="95" y="270">Parent/Guardian</text>
    <!-- Youth -->
    <rect x="80" y="320" width="120" height="50" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <text x="110" y="350">Youth</text>
    <!-- Parent/Guardian -> Web UI -->
    <line x1="140" y1="240" x2="140" y2="180" stroke="#d81b60" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="145" y="200" font-size="12">Login, Manage</text>
    <!-- Youth -> Core Banking (spend) -->
    <line x1="200" y1="345" x2="1040" y2="120" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="650" y="330" font-size="12">Card Spends</text>
    <!-- Compliance and Audit -->
    <rect x="40" y="500" width="1120" height="80" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
    <text x="60" y="530" font-size="15">Compliance: GDPR, PCI-DSS, ISO 27001 | All APIs OAuth2 secured, RBAC enforced, audit logged (user, timestamp, action, outcome), logs retained 7 years</text>
    <text x="60" y="550" font-size="13">Non-Functional: <500ms API, Multi-AZ, stateless, CI/CD, DR, monitoring, centralized logging, input validation, output filtering</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#1976d2"/>
    </marker>
  </defs>
</svg>