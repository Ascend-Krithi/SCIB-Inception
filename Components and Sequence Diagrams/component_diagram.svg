<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid C4-style Component Diagram (SVG) for Youth Account Management -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600">
  <rect x="40" y="40" width="180" height="60" fill="#ECECEC" stroke="#333" />
  <text x="130" y="75" font-size="16" text-anchor="middle" fill="#222">Banking Web App</text>

  <rect x="270" y="40" width="180" height="60" fill="#B3E5FC" stroke="#333" />
  <text x="360" y="75" font-size="16" text-anchor="middle" fill="#222">Youth Account API Gateway</text>

  <rect x="500" y="40" width="180" height="60" fill="#C8E6C9" stroke="#333" />
  <text x="590" y="75" font-size="16" text-anchor="middle" fill="#222">Account Service</text>

  <rect x="500" y="140" width="180" height="60" fill="#FFF9C4" stroke="#333" />
  <text x="590" y="175" font-size="16" text-anchor="middle" fill="#222">Payment Service</text>

  <rect x="500" y="240" width="180" height="60" fill="#FFCCBC" stroke="#333" />
  <text x="590" y="275" font-size="16" text-anchor="middle" fill="#222">Transaction Service</text>

  <rect x="270" y="340" width="180" height="60" fill="#D1C4E9" stroke="#333" />
  <text x="360" y="375" font-size="16" text-anchor="middle" fill="#222">Youth Account DB</text>

  <!-- Arrows -->
  <line x1="220" y1="70" x2="270" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="450" y1="70" x2="500" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="450" y1="70" x2="500" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="450" y1="70" x2="500" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="360" y1="100" x2="360" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#333" />
    </marker>
  </defs>
</svg>
