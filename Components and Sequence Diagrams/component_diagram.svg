<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG: C4 Container Diagram for Parent-Managed Youth Account Management -->
<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <g font-family="sans-serif" font-size="14">
    <!-- Containers -->
    <rect x="20" y="40" width="180" height="70" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"/>
    <text x="110" y="70" text-anchor="middle" font-weight="bold">Web UI (React)</text>
    <rect x="250" y="40" width="220" height="70" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
    <text x="360" y="70" text-anchor="middle" font-weight="bold">Youth Account API (Spring Boot)</text>
    <rect x="520" y="40" width="160" height="70" fill="#ede7f6" stroke="#512da8" stroke-width="2" rx="8"/>
    <text x="600" y="70" text-anchor="middle" font-weight="bold">OAuth2 Auth Service</text>
    <rect x="250" y="160" width="120" height="60" fill="#f1f8e9" stroke="#388e3c" stroke-width="2" rx="8"/>
    <text x="310" y="190" text-anchor="middle">Account DB</text>
    <rect x="400" y="160" width="140" height="60" fill="#fce4ec" stroke="#d81b60" stroke-width="2" rx="8"/>
    <text x="470" y="190" text-anchor="middle">Youth Settings</text>
    <rect x="580" y="160" width="140" height="60" fill="#e0f7fa" stroke="#0097a7" stroke-width="2" rx="8"/>
    <text x="650" y="190" text-anchor="middle">Transaction Ledger</text>
    <rect x="750" y="40" width="120" height="70" fill="#fffde7" stroke="#fbc02d" stroke-width="2" rx="8"/>
    <text x="810" y="70" text-anchor="middle">Payment Service</text>
    <!-- External Actors -->
    <circle cx="70" cy="250" r="30" fill="#fff" stroke="#1976d2" stroke-width="2"/>
    <text x="70" y="255" text-anchor="middle" font-weight="bold">Parent</text>
    <!-- Links -->
    <line x1="70" y1="220" x2="110" y2="110" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="200" y1="75" x2="250" y2="75" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="470" y1="75" x2="520" y2="75" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="470" y1="75" x2="470" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="360" y1="110" x2="310" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="360" y1="110" x2="470" y2="160" stroke="#d81b60" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="360" y1="110" x2="650" y2="160" stroke="#0097a7" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="470" y1="75" x2="750" y2="75" stroke="#fbc02d" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Arrow Definition -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#1976d2"/>
      </marker>
    </defs>
    <!-- Labels -->
    <text x="170" y="90" font-size="12">REST API calls</text>
    <text x="370" y="130" font-size="12">OAuth2/JWT</text>
    <text x="320" y="220" font-size="12">CRUD</text>
    <text x="480" y="220" font-size="12">Settings R/W</text>
    <text x="660" y="220" font-size="12">Fetch Txns</text>
    <text x="800" y="120" font-size="12">Fund Transfer</text>
  </g>
</svg>