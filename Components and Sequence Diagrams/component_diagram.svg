<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid C4-style Component Diagram for Parent-Managed Youth Account Feature -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <g font-family="Arial" font-size="16">
    <!-- WebApp -->
    <rect x="70" y="50" width="170" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="9"/>
    <text x="85" y="85">Web Application</text>
    <text x="85" y="105" font-size="12">React/Angular</text>
    <!-- API Gateway -->
    <rect x="300" y="50" width="170" height="60" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="9"/>
    <text x="315" y="85">API Gateway</text>
    <text x="315" y="105" font-size="12">Spring Boot</text>
    <!-- Youth Account Service -->
    <rect x="530" y="50" width="210" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="9"/>
    <text x="545" y="85">Youth Account Service</text>
    <text x="545" y="105" font-size="12">Spring Boot</text>
    <!-- Settings DB -->
    <rect x="530" y="180" width="140" height="50" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" rx="9"/>
    <text x="545" y="210">Settings DB</text>
    <text x="545" y="225" font-size="12">PostgreSQL</text>
    <!-- Transaction DB -->
    <rect x="700" y="180" width="140" height="50" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" rx="9"/>
    <text x="715" y="210">Transaction DB</text>
    <text x="715" y="225" font-size="12">PostgreSQL</text>
    <!-- External Services -->
    <rect x="530" y="330" width="120" height="50" fill="#fffde7" stroke="#fbc02d" stroke-width="2" rx="9"/>
    <text x="545" y="360">Account Service</text>
    <rect x="670" y="330" width="120" height="50" fill="#fffde7" stroke="#fbc02d" stroke-width="2" rx="9"/>
    <text x="685" y="360">Payment Service</text>
    <rect x="810" y="330" width="120" height="50" fill="#fffde7" stroke="#fbc02d" stroke-width="2" rx="9"/>
    <text x="825" y="360">Transaction Service</text>
    <!-- Relationships -->
    <line x1="240" y1="80" x2="300" y2="80" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="470" y1="80" x2="530" y2="80" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="640" y1="110" x2="600" y2="180" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="700" y1="110" x2="770" y2="180" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="640" y1="110" x2="590" y2="330" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="700" y1="110" x2="730" y2="330" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="740" y1="110" x2="870" y2="330" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
        <path d="M2,2 L10,6 L2,10 L6,6 L2,2" style="fill:#333;"/>
      </marker>
    </defs>
    <!-- Legend -->
    <rect x="50" y="580" width="800" height="50" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
    <text x="60" y="610" font-size="13">Legend: WebApp, API Gateway, and Youth Account Service are containerized (Azure), Settings DB and Transaction DB are PostgreSQL, external services are Account/Payment/Transaction Service. All APIs are OAuth2 and RBAC enforced, all actions audit logged. Compliance: GDPR, PCI-DSS, ISO 27001.</text>
  </g>
</svg>