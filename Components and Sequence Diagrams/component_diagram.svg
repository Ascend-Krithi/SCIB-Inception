%% Component Diagram: Youth Account Management System (C4-style, Mermaid)
%% Render as SVG with Mermaid
%% To view: https://mermaid-js.github.io/mermaid-live-editor/
%%
%% C4 Component Diagram
---
flowchart TD
    subgraph Web
        A[Parent/Guardian]
        B[Banking Web Application]
    end
    subgraph Cloud Platform
        G[API Gateway]
        H[Youth Account API]
        I[Account Service]
        J[Transaction Service]
        K[Settings Service]
        L[(Database)]
    end
    A-->|OAuth, HTTPS|B
    B-->|REST|G
    G-->|Routes, OAuth|H
    H-->|REST: balance|I
    H-->|REST: transactions|J
    H-->|REST: limits|K
    K-->|SQL|L
    H-.->|Audit Logging|L
    G-.->|RBAC, Audit|L
    %% Components inside Youth Account API
    subgraph "Youth Account API"
        H1[Dashboard Handler]
        H2[Fund Transfer Handler]
        H3[Spending Limit Handler]
        H4[Transaction History Handler]
    end
    H1---H
    H2---H
    H3---H
    H4---H
    H1-->|Aggregates|I
    H1-->|Aggregates|K
    H1-->|Aggregates|J
    H2-->|Transfers|I
    H2-->|Logs|J
    H3-->|Updates|K
    H4-->|Fetches|J
    style H1 fill:#e6f7ff,stroke:#333,stroke-width:1px
    style H2 fill:#e6f7ff,stroke:#333,stroke-width:1px
    style H3 fill:#e6f7ff,stroke:#333,stroke-width:1px
    style H4 fill:#e6f7ff,stroke:#333,stroke-width:1px
    %% Compliance notes
    classDef compliance fill:#fffbe6,stroke:#333,stroke-dasharray: 5 5;
    G:::compliance
    H:::compliance
    K:::compliance
    L:::compliance
