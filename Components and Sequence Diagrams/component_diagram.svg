<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG: Youth Account Management Component Diagram (C4-style) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800">
  <g>
    <rect x="40" y="50" width="1000" height="700" fill="#f6faff" stroke="#b0c4de" stroke-width="2" rx="20"/>
    <text x="550" y="85" font-size="24" text-anchor="middle" fill="#003366">Banking Web Application</text>
    <!-- UI -->
    <rect x="120" y="150" width="240" height="80" fill="#e6f2ff" stroke="#003366" stroke-width="2" rx="10"/>
    <text x="240" y="185" font-size="18" text-anchor="middle" fill="#003366">Parent Portal UI</text>
    <!-- API -->
    <rect x="420" y="150" width="260" height="80" fill="#cce6ff" stroke="#003366" stroke-width="2" rx="10"/>
    <text x="550" y="185" font-size="18" text-anchor="middle" fill="#003366">Youth Account API</text>
    <!-- Auth -->
    <rect x="760" y="150" width="180" height="80" fill="#fff2cc" stroke="#c19a00" stroke-width="2" rx="10"/>
    <text x="850" y="185" font-size="16" text-anchor="middle" fill="#a67c00">OAuth Auth Service</text>
    <!-- Settings DB -->
    <rect x="120" y="320" width="200" height="70" fill="#d1e7dd" stroke="#146c43" stroke-width="2" rx="10"/>
    <text x="220" y="355" font-size="16" text-anchor="middle" fill="#146c43">Settings DB</text>
    <!-- Account Service -->
    <rect x="370" y="320" width="180" height="70" fill="#ffe6e6" stroke="#cc0000" stroke-width="2" rx="10"/>
    <text x="460" y="355" font-size="16" text-anchor="middle" fill="#cc0000">Account Service</text>
    <!-- Transaction Service -->
    <rect x="590" y="320" width="200" height="70" fill="#e5ccff" stroke="#7c3fc1" stroke-width="2" rx="10"/>
    <text x="690" y="355" font-size="16" text-anchor="middle" fill="#7c3fc1">Transaction Service</text>
    <!-- Payment Service -->
    <rect x="830" y="320" width="170" height="70" fill="#c6f0ff" stroke="#0086b3" stroke-width="2" rx="10"/>
    <text x="915" y="355" font-size="16" text-anchor="middle" fill="#0086b3">Payment Service</text>
    <!-- Actors -->
    <ellipse cx="90" cy="90" rx="35" ry="30" fill="#fff" stroke="#007bff" stroke-width="2"/>
    <text x="90" y="95" font-size="14" text-anchor="middle" fill="#007bff">Parent</text>
    <ellipse cx="1010" cy="90" rx="35" ry="30" fill="#fff" stroke="#007bff" stroke-width="2"/>
    <text x="1010" y="95" font-size="14" text-anchor="middle" fill="#007bff">Youth</text>
    <!-- Flows -->
    <!-- Parent to UI -->
    <line x1="90" y1="120" x2="240" y2="150" stroke="#007bff" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- UI to API -->
    <line x1="360" y1="190" x2="420" y2="190" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- API to Auth -->
    <line x1="680" y1="190" x2="760" y2="190" stroke="#c19a00" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- API to Settings DB -->
    <line x1="550" y1="230" x2="220" y2="320" stroke="#146c43" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- API to Account Service -->
    <line x1="550" y1="230" x2="460" y2="320" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- API to Transaction Service -->
    <line x1="550" y1="230" x2="690" y2="320" stroke="#7c3fc1" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- API to Payment Service -->
    <line x1="550" y1="230" x2="915" y2="320" stroke="#0086b3" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Youth to UI (read-only) -->
    <line x1="1010" y1="120" x2="820" y2="150" stroke="#007bff" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
    <!-- Arrowhead Marker -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
      </marker>
    </defs>
  </g>
  <!-- Legend -->
  <g>
    <rect x="800" y="600" width="260" height="130" fill="#fff" stroke="#aaa" stroke-width="1" rx="10"/>
    <text x="930" y="625" font-size="16" text-anchor="middle" fill="#003366">Legend</text>
    <text x="820" y="650" font-size="13" fill="#003366">&#x25A0; Parent Portal UI</text>
    <text x="820" y="670" font-size="13" fill="#003366">&#x25A0; Youth Account API</text>
    <text x="820" y="690" font-size="13" fill="#c19a00">&#x25A0; OAuth Auth Service</text>
    <text x="820" y="710" font-size="13" fill="#146c43">&#x25A0; Settings DB</text>
    <text x="820" y="730" font-size="13" fill="#cc0000">&#x25A0; Account Service</text>
    <text x="950" y="650" font-size="13" fill="#7c3fc1">&#x25A0; Transaction Service</text>
    <text x="950" y="670" font-size="13" fill="#0086b3">&#x25A0; Payment Service</text>
    <text x="950" y="690" font-size="13" fill="#007bff">&#x25CB; Actor</text>
    <text x="950" y="710" font-size="13" fill="#333">&#x2014; Data/API Flow</text>
    <text x="950" y="730" font-size="13" fill="#333">- - - Read-only Flow</text>
  </g>
</svg>
