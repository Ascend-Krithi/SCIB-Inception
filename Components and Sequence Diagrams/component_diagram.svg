<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG Export: Youth Account Management Component Diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<g font-family="monospace" font-size="14">
  <!-- Parent/Guardian -->
  <rect x="30" y="40" width="140" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="8"/>
  <text x="40" y="65">Parent/Guardian</text>
  <!-- Web UI -->
  <rect x="200" y="40" width="180" height="40" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="8"/>
  <text x="210" y="65">Banking Web Application</text>
  <!-- Youth Account Management Service -->
  <rect x="420" y="130" width="260" height="60" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="10"/>
  <text x="430" y="160">Youth Account Management Service</text>
  <rect x="460" y="150" width="180" height="30" fill="#FFFFFF" stroke="#388E3C" stroke-width="1" rx="6"/>
  <text x="470" y="170">REST API (Spring Boot)</text>
  <!-- Settings DB -->
  <rect x="750" y="120" width="120" height="40" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2" rx="8"/>
  <text x="760" y="145">Settings DB</text>
  <!-- Account Service -->
  <rect x="750" y="230" width="120" height="40" fill="#E1F5FE" stroke="#0288D1" stroke-width="2" rx="8"/>
  <text x="760" y="255">Account Service</text>
  <!-- Transaction Service -->
  <rect x="750" y="320" width="120" height="40" fill="#FFFDE7" stroke="#FBC02D" stroke-width="2" rx="8"/>
  <text x="760" y="345">Transaction Service</text>

  <!-- Connections -->
  <line x1="170" y1="60" x2="200" y2="60" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="60" x2="420" y2="160" stroke="#F57C00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="160" x2="750" y2="140" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="160" x2="750" y2="250" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="160" x2="750" y2="340" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- WebApp to Parent -->
  <line x1="200" y1="80" x2="100" y2="80" stroke="#1976D2" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="120" y="100" font-size="12" fill="#1976D2">UI</text>
  <!-- Legend -->
  <rect x="30" y="600" width="210" height="40" fill="#FFFFFF" stroke="#888" stroke-width="1" rx="6"/>
  <text x="40" y="620" font-size="12">Legend: REST API = Green, UI = Blue, DB = Purple</text>
</g>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#333" />
  </marker>
</defs>
</svg>
