<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG: C4 Container Diagram for Youth Account Management -->
<svg width="920" height="480" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Arial" font-size="14">
    <!-- System Boundary -->
    <rect x="20" y="20" width="880" height="440" rx="16" fill="#F3F8FF" stroke="#0057B8" stroke-width="2"/>
    <text x="40" y="48" font-size="18" font-weight="bold" fill="#0057B8">Banking Web Application</text>
    <!-- UI -->
    <rect x="60" y="80" width="200" height="60" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="90" y="115">Parent Dashboard UI</text>
    <!-- API -->
    <rect x="340" y="80" width="200" height="60" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="400" y="115">Youth Account API</text>
    <!-- Auth Service -->
    <rect x="650" y="80" width="200" height="60" rx="10" fill="#F8BBD0" stroke="#C2185B" stroke-width="2"/>
    <text x="690" y="115">OAuth2 Auth Service</text>
    <!-- Database -->
    <rect x="200" y="200" width="180" height="60" rx="10" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2"/>
    <text x="220" y="235">Database (PostgreSQL)</text>
    <!-- Account Service -->
    <rect x="420" y="200" width="180" height="60" rx="10" fill="#C8E6C9" stroke="#388E3C" stroke-width="2"/>
    <text x="450" y="235">Account Service</text>
    <!-- Payment Service -->
    <rect x="650" y="200" width="200" height="60" rx="10" fill="#FFECB3" stroke="#FFA000" stroke-width="2"/>
    <text x="700" y="235">Payment Service</text>
    <!-- Transaction Service -->
    <rect x="340" y="320" width="200" height="60" rx="10" fill="#D1C4E9" stroke="#512DA8" stroke-width="2"/>
    <text x="370" y="355">Transaction Service</text>
    <!-- Arrows -->
    <!-- UI -> API -->
    <line x1="260" y1="110" x2="340" y2="110" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- API -> Auth Service -->
    <line x1="540" y1="110" x2="650" y2="110" stroke="#C2185B" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- API -> DB -->
    <line x1="440" y1="140" x2="340" y2="200" stroke="#FBC02D" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- API -> Account Service -->
    <line x1="540" y1="140" x2="600" y2="200" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- API -> Payment Service -->
    <line x1="540" y1="140" x2="750" y2="200" stroke="#FFA000" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- API -> Transaction Service -->
    <line x1="440" y1="140" x2="440" y2="320" stroke="#512DA8" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#333" />
      </marker>
    </defs>
  </g>
  <!-- Legend -->
  <g font-family="Arial" font-size="12">
    <rect x="740" y="400" width="140" height="60" rx="10" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1"/>
    <text x="750" y="420" font-weight="bold">Legend:</text>
    <text x="750" y="440">Blue: UI/API</text>
    <text x="750" y="455">Pink: Auth</text>
    <text x="750" y="470">Yellow: DB/Payment</text>
    <text x="750" y="485">Green: Account</text>
    <text x="750" y="500">Purple: Transaction</text>
  </g>
</svg>
