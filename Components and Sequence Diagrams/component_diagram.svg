<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600">
  <rect width="900" height="600" fill="#fff"/>
  <text x="20" y="40" font-size="28" font-family="Arial" font-weight="bold">Component Diagram: Youth Account Management</text>
  <rect x="60" y="80" width="180" height="120" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
  <text x="75" y="110" font-size="18" font-family="Arial">User Interface</text>
  <text x="75" y="130" font-size="14" font-family="Arial">React/Angular/iOS/Android</text>
  <text x="75" y="150" font-size="14" font-family="Arial">Dashboards, Transfers</text>
  <rect x="260" y="80" width="180" height="120" fill="#cfe2ff" stroke="#000" stroke-width="2"/>
  <text x="275" y="110" font-size="18" font-family="Arial">API Gateway</text>
  <text x="275" y="130" font-size="14" font-family="Arial">Node.js/Spring Boot</text>
  <text x="275" y="150" font-size="14" font-family="Arial">REST Endpoints</text>
  <rect x="460" y="80" width="180" height="120" fill="#f9c2c2" stroke="#000" stroke-width="2"/>
  <text x="475" y="110" font-size="18" font-family="Arial">Youth Account Service</text>
  <text x="475" y="130" font-size="14" font-family="Arial">Java/Spring Boot</text>
  <text x="475" y="150" font-size="14" font-family="Arial">Business Logic</text>
  <rect x="660" y="80" width="180" height="120" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
  <text x="675" y="110" font-size="18" font-family="Arial">Youth Account DB</text>
  <text x="675" y="130" font-size="14" font-family="Arial">PostgreSQL</text>
  <text x="675" y="150" font-size="14" font-family="Arial">Limits, Audit Logs</text>
  <rect x="260" y="240" width="180" height="120" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
  <text x="275" y="270" font-size="18" font-family="Arial">Core Banking System</text>
  <text x="275" y="290" font-size="14" font-family="Arial">Balances, Transfers</text>
  <rect x="460" y="240" width="180" height="120" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
  <text x="475" y="270" font-size="18" font-family="Arial">Transaction Service</text>
  <text x="475" y="290" font-size="14" font-family="Arial">Transaction History</text>
  <rect x="660" y="240" width="180" height="120" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
  <text x="675" y="270" font-size="18" font-family="Arial">Notification Service</text>
  <text x="675" y="290" font-size="14" font-family="Arial">Alerts, Notifications</text>
  <!-- Connectors -->
  <line x1="240" y1="140" x2="260" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="140" x2="460" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="140" x2="660" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="200" x2="340" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="200" x2="550" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="200" x2="750" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#000"/>
    </marker>
  </defs>
</svg>