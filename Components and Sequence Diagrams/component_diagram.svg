<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- SVG Exported Mermaid C4 Component Diagram -->
<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .component { fill: #e0f0ff; stroke: #004080; stroke-width: 2; }
    .external { fill: #fffbe0; stroke: #bfa000; stroke-width: 2; }
    .text { font-family: Arial, sans-serif; font-size: 16px; }
    .title { font-size: 20px; font-weight: bold; }
    .arrow { stroke: #444; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="30" y="40" class="title">Youth Account Management - Component Diagram</text>

  <!-- Internal Components -->
  <rect x="80" y="100" width="180" height="60" class="component"/>
  <text x="90" y="135" class="text">Parent Dashboard UI</text>

  <rect x="320" y="100" width="210" height="60" class="component"/>
  <text x="330" y="135" class="text">Youth Account API</text>

  <rect x="580" y="100" width="180" height="60" class="component"/>
  <text x="590" y="135" class="text">Auth Service (OAuth2)</text>

  <rect x="320" y="250" width="180" height="60" class="component"/>
  <text x="330" y="285" class="text">Database (PostgreSQL)</text>

  <!-- External Services -->
  <rect x="60" y="400" width="180" height="60" class="external"/>
  <text x="70" y="435" class="text">Account Service</text>

  <rect x="370" y="400" width="180" height="60" class="external"/>
  <text x="380" y="435" class="text">Payment Service</text>

  <rect x="670" y="400" width="180" height="60" class="external"/>
  <text x="680" y="435" class="text">Transaction Service</text>

  <!-- Arrows: UI -> API -->
  <line x1="260" y1="130" x2="320" y2="130" class="arrow"/>
  <!-- Arrows: API -> Auth Service -->
  <line x1="530" y1="130" x2="580" y2="130" class="arrow"/>
  <!-- Arrows: API -> DB -->
  <line x1="425" y1="160" x2="410" y2="250" class="arrow"/>
  <!-- Arrows: API -> Account Service -->
  <line x1="320" y1="160" x2="150" y2="400" class="arrow"/>
  <!-- Arrows: API -> Payment Service -->
  <line x1="430" y1="160" x2="460" y2="400" class="arrow"/>
  <!-- Arrows: API -> Transaction Service -->
  <line x1="530" y1="160" x2="760" y2="400" class="arrow"/>

  <!-- Legends -->
  <rect x="700" y="50" width="20" height="20" class="component"/>
  <text x="730" y="65" class="text">Internal Component</text>
  <rect x="700" y="80" width="20" height="20" class="external"/>
  <text x="730" y="95" class="text">External Service</text>
</svg>