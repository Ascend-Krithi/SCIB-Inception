<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Arial" font-size="16">
    <!-- Component boxes -->
    <rect x="40" y="40" width="180" height="80" fill="#f5f5f5" stroke="#0074d9"/>
    <text x="55" y="75">Banking Web App</text>
    <text x="55" y="95" font-size="14">React/Angular UI</text>
    <rect x="260" y="40" width="180" height="80" fill="#f5f5f5" stroke="#0074d9"/>
    <text x="275" y="75">Youth Account API</text>
    <text x="275" y="95" font-size="14">Node.js/Java REST API</text>
    <rect x="480" y="40" width="180" height="80" fill="#f5f5f5" stroke="#0074d9"/>
    <text x="495" y="75">Core Banking Adapter</text>
    <text x="495" y="95" font-size="14">Microservice Adapter</text>
    <rect x="700" y="40" width="180" height="80" fill="#f5f5f5" stroke="#0074d9"/>
    <text x="715" y="75">IAM/OAuth2 Service</text>
    <text x="715" y="95" font-size="14">Okta/Auth0</text>
    <rect x="260" y="160" width="180" height="80" fill="#f5f5f5" stroke="#0074d9"/>
    <text x="275" y="195">Youth Account DB</text>
    <text x="275" y="215" font-size="14">RDS/Postgres</text>
    <!-- Relationships -->
    <line x1="130" y1="120" x2="350" y2="120" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="170" y="115" font-size="14">REST/JSON API Calls</text>
    <line x1="350" y1="120" x2="570" y2="120" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="390" y="115" font-size="14">Service integration</text>
    <line x1="350" y1="120" x2="350" y2="200" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="160" font-size="14">CRUD</text>
    <line x1="350" y1="120" x2="790" y2="120" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="600" y="115" font-size="14">Token validation, RBAC</text>
    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0,0 10,5 0,10" fill="#111"/>
      </marker>
    </defs>
  </g>
</svg>