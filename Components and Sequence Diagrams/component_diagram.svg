<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid C4-Style Component Diagram for Youth Account Management -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <g>
    <rect x="50" y="50" width="200" height="80" rx="10" fill="#f3f6fa" stroke="#333" stroke-width="2"/>
    <text x="150" y="90" font-size="18" text-anchor="middle" fill="#222">Web UI (Angular/React)</text>
    <rect x="300" y="50" width="200" height="80" rx="10" fill="#e2f0d9" stroke="#333" stroke-width="2"/>
    <text x="400" y="90" font-size="18" text-anchor="middle" fill="#222">API Gateway (Spring/Express)</text>
    <rect x="550" y="50" width="200" height="80" rx="10" fill="#dbe9fa" stroke="#333" stroke-width="2"/>
    <text x="650" y="90" font-size="18" text-anchor="middle" fill="#222">Youth Account Service (Java/.NET)</text>
    <rect x="800" y="50" width="150" height="80" rx="10" fill="#fff2cc" stroke="#333" stroke-width="2"/>
    <text x="875" y="90" font-size="15" text-anchor="middle" fill="#222">Account Service (Ext)</text>
    <rect x="800" y="180" width="150" height="80" rx="10" fill="#fff2cc" stroke="#333" stroke-width="2"/>
    <text x="875" y="220" font-size="15" text-anchor="middle" fill="#222">Transaction Service (Ext)</text>
    <rect x="550" y="180" width="200" height="80" rx="10" fill="#fde9d9" stroke="#333" stroke-width="2"/>
    <text x="650" y="220" font-size="15" text-anchor="middle" fill="#222">Settings DB (Postgres)</text>
    <rect x="550" y="310" width="200" height="80" rx="10" fill="#fde9d9" stroke="#333" stroke-width="2"/>
    <text x="650" y="350" font-size="15" text-anchor="middle" fill="#222">Ledger DB (Postgres)</text>
    <!-- Arrows -->
    <line x1="250" y1="90" x2="300" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="500" y1="90" x2="550" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="750" y1="90" x2="800" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="750" y1="90" x2="750" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="650" y1="130" x2="650" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="650" y1="260" x2="650" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Legend -->
    <rect x="50" y="600" width="220" height="70" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="160" y="625" font-size="15" text-anchor="middle" fill="#222">Legend</text>
    <rect x="70" y="640" width="20" height="20" fill="#e2f0d9" stroke="#333" stroke-width="1"/>
    <text x="100" y="655" font-size="13" fill="#222">API Gateway</text>
    <rect x="170" y="640" width="20" height="20" fill="#dbe9fa" stroke="#333" stroke-width="1"/>
    <text x="200" y="655" font-size="13" fill="#222">Youth Account Service</text>
    <!-- Arrow marker -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#333" />
      </marker>
    </defs>
  </g>
</svg>