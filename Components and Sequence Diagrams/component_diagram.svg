<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="600" xmlns="http://www.w3.org/2000/svg">
  <desc>Component Diagram for Parent Fund Allocation & Youth Account Management</desc>
  <g font-family="Arial" font-size="14">
    <!-- Components -->
    <rect x="60" y="60" width="180" height="60" fill="#d1e7dd" stroke="#333"/>
    <text x="80" y="90">Parent Dashboard UI</text>
    <rect x="300" y="60" width="200" height="60" fill="#cfe2ff" stroke="#333"/>
    <text x="340" y="90">Youth Account API</text>
    <rect x="580" y="60" width="180" height="60" fill="#f8d7da" stroke="#333"/>
    <text x="600" y="90">Account Service</text>
    <rect x="820" y="60" width="140" height="60" fill="#fff3cd" stroke="#333"/>
    <text x="840" y="90">Payment Service</text>
    <rect x="300" y="200" width="180" height="60" fill="#e2e3e5" stroke="#333"/>
    <text x="320" y="230">Youth Account DB</text>
    <rect x="580" y="200" width="180" height="60" fill="#e2e3e5" stroke="#333"/>
    <text x="600" y="230">Transaction Service</text>
    <!-- Connectors -->
    <line x1="240" y1="90" x2="300" y2="90" stroke="#333" marker-end="url(#arrow)"/>
    <line x1="500" y1="90" x2="580" y2="90" stroke="#333" marker-end="url(#arrow)"/>
    <line x1="500" y1="90" x2="300" y2="230" stroke="#333" marker-end="url(#arrow)"/>
    <line x1="500" y1="90" x2="580" y2="230" stroke="#333" marker-end="url(#arrow)"/>
    <line x1="500" y1="90" x2="820" y2="90" stroke="#333" marker-end="url(#arrow)"/>
    <!-- Labels -->
    <text x="260" y="75">REST/HTTPS</text>
    <text x="520" y="75">REST/HTTPS</text>
    <text x="520" y="125">JDBC/ORM</text>
    <text x="700" y="125">REST/HTTPS</text>
    <text x="700" y="250">REST/HTTPS</text>
    <text x="400" y="170">REST/HTTPS</text>
    <text x="700" y="170">REST/HTTPS</text>
    <text x="600" y="300">REST/HTTPS</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 L2,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>