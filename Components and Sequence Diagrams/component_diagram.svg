<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG Export: Component Diagram for Youth Account Management -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
<!-- Mermaid Component Diagram (C4 Style) -->
<g>
  <rect x="40" y="40" width="180" height="70" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="10"/>
  <text x="55" y="70" font-family="Arial" font-size="16" fill="#1976D2">Parent Dashboard UI</text>
  <rect x="260" y="40" width="210" height="70" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="10"/>
  <text x="275" y="70" font-family="Arial" font-size="16" fill="#F57C00">Youth Account API</text>
  <rect x="520" y="40" width="180" height="70" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="10"/>
  <text x="535" y="70" font-family="Arial" font-size="16" fill="#388E3C">OAuth Auth Service</text>
  <rect x="260" y="170" width="210" height="90" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2" rx="10"/>
  <text x="275" y="200" font-family="Arial" font-size="16" fill="#8E24AA">Youth Account DB</text>
  <rect x="520" y="170" width="180" height="70" fill="#FFFDE7" stroke="#FBC02D" stroke-width="2" rx="10"/>
  <text x="535" y="200" font-family="Arial" font-size="16" fill="#FBC02D">Core Banking Service</text>
  <rect x="40" y="300" width="180" height="70" fill="#E1F5FE" stroke="#0288D1" stroke-width="2" rx="10"/>
  <text x="55" y="330" font-family="Arial" font-size="16" fill="#0288D1">Payment Service</text>
  <rect x="260" y="300" width="210" height="70" fill="#F9FBE7" stroke="#AFB42B" stroke-width="2" rx="10"/>
  <text x="275" y="330" font-family="Arial" font-size="16" fill="#AFB42B">Transaction Ledger Service</text>
  <rect x="520" y="300" width="180" height="70" fill="#FBE9E7" stroke="#D84315" stroke-width="2" rx="10"/>
  <text x="535" y="330" font-family="Arial" font-size="16" fill="#D84315">Bank Admin</text>
  <!-- Arrows -->
  <line x1="120" y1="110" x2="365" y2="110" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="365" y1="110" x2="610" y2="110" stroke="#F57C00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="365" y1="110" x2="365" y2="170" stroke="#8E24AA" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="365" y1="260" x2="610" y2="205" stroke="#FBC02D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="120" y1="370" x2="365" y2="370" stroke="#0288D1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="365" y1="370" x2="610" y2="335" stroke="#D84315" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="365" y1="370" x2="365" y2="260" stroke="#AFB42B" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</g>
</svg>