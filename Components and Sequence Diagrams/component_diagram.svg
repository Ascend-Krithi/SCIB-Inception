<?xml version="1.0" encoding="UTF-8"?>
<!-- SVG Export of Component Diagram (Mermaid C4 style) -->
<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" aria-label="Component Diagram">
  <g font-family="Arial, sans-serif" font-size="16">
    <!-- Web UI -->
    <rect x="50" y="80" width="170" height="60" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="10"/>
    <text x="135" y="115" text-anchor="middle" fill="#1976D2">Web UI (React)</text>
    <!-- Youth Account API -->
    <rect x="300" y="80" width="210" height="60" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="10"/>
    <text x="405" y="115" text-anchor="middle" fill="#FF9800">Youth Account API (Spring Boot)</text>
    <!-- Account DB -->
    <rect x="600" y="60" width="200" height="50" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="10"/>
    <text x="700" y="90" text-anchor="middle" fill="#388E3C">Account DB (PostgreSQL)</text>
    <!-- Settings DB -->
    <rect x="600" y="130" width="200" height="50" fill="#E1F5FE" stroke="#0288D1" stroke-width="2" rx="10"/>
    <text x="700" y="160" text-anchor="middle" fill="#0288D1">Settings DB (PostgreSQL)</text>
    <!-- Transaction Service -->
    <rect x="600" y="200" width="200" height="50" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2" rx="10"/>
    <text x="700" y="230" text-anchor="middle" fill="#8E24AA">Transaction Service</text>
    <!-- Payment Service -->
    <rect x="300" y="200" width="210" height="50" fill="#FFEBEE" stroke="#D32F2F" stroke-width="2" rx="10"/>
    <text x="405" y="230" text-anchor="middle" fill="#D32F2F">Payment Service</text>
    <!-- Transaction Ledger -->
    <rect x="300" y="270" width="210" height="50" fill="#EDE7F6" stroke="#303F9F" stroke-width="2" rx="10"/>
    <text x="405" y="300" text-anchor="middle" fill="#303F9F">Transaction Ledger</text>
    <!-- OAuth2 Auth Service -->
    <rect x="50" y="200" width="170" height="50" fill="#FFFDE7" stroke="#FBC02D" stroke-width="2" rx="10"/>
    <text x="135" y="230" text-anchor="middle" fill="#FBC02D">OAuth2 Auth Service</text>
    <!-- Edges -->
    <!-- Web UI -> Youth Account API -->
    <line x1="220" y1="110" x2="300" y2="110" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Web UI -> OAuth2 Auth Service -->
    <line x1="135" y1="140" x2="135" y2="200" stroke="#FBC02D" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Youth Account API -> Account DB -->
    <line x1="510" y1="110" x2="600" y2="85" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Youth Account API -> Settings DB -->
    <line x1="510" y1="110" x2="600" y2="155" stroke="#0288D1" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Youth Account API -> Transaction Service -->
    <line x1="405" y1="140" x2="700" y2="200" stroke="#8E24AA" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Youth Account API -> Payment Service -->
    <line x1="405" y1="140" x2="405" y2="200" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Youth Account API -> Transaction Ledger -->
    <line x1="405" y1="140" x2="405" y2="270" stroke="#303F9F" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Arrowhead marker -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
      </marker>
    </defs>
  </g>
  <!-- Compliance/Traceability legend -->
  <g font-size="13">
    <rect x="10" y="500" width="880" height="80" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1" rx="8"/>
    <text x="20" y="520" fill="#333">Compliance: OAuth2, RBAC, Audit Logging, PCI-DSS, GDPR, ISO 27001</text>
    <text x="20" y="540" fill="#333">Traceability: APIs mapped to ADRs (SCIB-25 to SCIB-30); All actions logged; Data encrypted at rest &amp; in transit</text>
  </g>
</svg>
