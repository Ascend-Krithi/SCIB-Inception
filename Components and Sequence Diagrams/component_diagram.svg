<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG: Youth Account Management Service Component Diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" font-family="Arial">
  <g>
    <rect x="40" y="40" width="880" height="540" rx="20" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
    <text x="480" y="70" font-size="22" text-anchor="middle" font-weight="bold">Youth Account Management Service - Component Diagram</text>
    <!-- API -->
    <rect x="110" y="120" width="220" height="80" rx="12" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
    <text x="220" y="160" font-size="15" text-anchor="middle">REST API
(Spring Boot)</text>
    <!-- DB -->
    <rect x="110" y="250" width="220" height="60" rx="12" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
    <text x="220" y="285" font-size="15" text-anchor="middle">Youth Account DB
(PostgreSQL)</text>
    <!-- Account Service -->
    <rect x="410" y="120" width="180" height="60" rx="12" fill="#ede7f6" stroke="#7c43bd" stroke-width="2"/>
    <text x="500" y="155" font-size="15" text-anchor="middle">Account Service
(REST API)</text>
    <!-- Payment Service -->
    <rect x="410" y="220" width="180" height="60" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
    <text x="500" y="255" font-size="15" text-anchor="middle">Payment Service
(REST API)</text>
    <!-- Transaction Service -->
    <rect x="410" y="320" width="180" height="60" rx="12" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
    <text x="500" y="355" font-size="15" text-anchor="middle">Transaction Service
(REST API)</text>
    <!-- Web Application -->
    <rect x="710" y="180" width="180" height="80" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="800" y="220" font-size="15" text-anchor="middle">Banking Web Application</text>
    <!-- Arrows -->
    <line x1="330" y1="160" x2="410" y2="150" stroke="#0288d1" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="330" y1="160" x2="410" y2="240" stroke="#43a047" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="330" y1="160" x2="410" y2="350" stroke="#e53935" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="220" y1="200" x2="220" y2="250" stroke="#fbc02d" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="710" y1="220" x2="330" y2="160" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Security, RBAC, Audit -->
    <rect x="650" y="350" width="240" height="60" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
    <text x="770" y="385" font-size="14" text-anchor="middle">OAuth2, RBAC, Audit Logging
(Enforced on all APIs)</text>
    <!-- Arrow marker -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#444" />
      </marker>
    </defs>
  </g>
</svg>