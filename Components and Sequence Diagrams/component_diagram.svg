<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG: Youth Account Management Component Diagram -->
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Arial" font-size="14">
    <rect x="20" y="40" width="220" height="80" fill="#E3F2FD" stroke="#1976D2" rx="10"/>
    <text x="130" y="70" text-anchor="middle" fill="#1976D2">Banking Web Application</text>
    <rect x="300" y="40" width="220" height="80" fill="#FFF3E0" stroke="#FF9800" rx="10"/>
    <text x="410" y="70" text-anchor="middle" fill="#FF9800">API Gateway (OAuth2, RBAC)</text>
    <rect x="580" y="20" width="180" height="50" fill="#F3E5F5" stroke="#8E24AA" rx="10"/>
    <text x="670" y="50" text-anchor="middle" fill="#8E24AA">Dashboard Service</text>
    <rect x="580" y="90" width="180" height="50" fill="#F3E5F5" stroke="#8E24AA" rx="10"/>
    <text x="670" y="120" text-anchor="middle" fill="#8E24AA">Fund Transfer Service</text>
    <rect x="580" y="160" width="180" height="50" fill="#F3E5F5" stroke="#8E24AA" rx="10"/>
    <text x="670" y="190" text-anchor="middle" fill="#8E24AA">Spending Limit Service</text>
    <rect x="580" y="230" width="180" height="50" fill="#F3E5F5" stroke="#8E24AA" rx="10"/>
    <text x="670" y="260" text-anchor="middle" fill="#8E24AA">Transaction History Service</text>
    <rect x="820" y="50" width="120" height="50" fill="#E8F5E9" stroke="#388E3C" rx="10"/>
    <text x="880" y="80" text-anchor="middle" fill="#388E3C">Account Service</text>
    <rect x="820" y="130" width="120" height="50" fill="#E8F5E9" stroke="#388E3C" rx="10"/>
    <text x="880" y="160" text-anchor="middle" fill="#388E3C">Transaction Service</text>
    <rect x="820" y="210" width="120" height="50" fill="#E8F5E9" stroke="#388E3C" rx="10"/>
    <text x="880" y="240" text-anchor="middle" fill="#388E3C">Settings DB</text>
    <!-- Arrows -->
    <line x1="240" y1="80" x2="300" y2="80" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="80" x2="580" y2="45" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="80" x2="580" y2="115" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="80" x2="580" y2="185" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="80" x2="580" y2="255" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Service to External -->
    <line x1="760" y1="45" x2="820" y2="75" stroke="#8E24AA" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="760" y1="115" x2="820" y2="155" stroke="#8E24AA" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="760" y1="185" x2="820" y2="235" stroke="#8E24AA" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="760" y1="255" x2="820" y2="235" stroke="#8E24AA" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#222" />
    </marker>
  </defs>
</svg>
