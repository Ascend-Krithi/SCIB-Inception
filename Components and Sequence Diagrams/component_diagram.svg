<?xml version="1.0" standalone="no"?>
<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <title>Component Diagram - Youth Account Parental Controls</title>
  <desc>Component relationships for youth account parental controls</desc>
  <g font-family="Arial" font-size="15">
    <!-- Components -->
    <rect x="50" y="100" width="180" height="60" fill="#cce5ff" stroke="#333" stroke-width="2"/>
    <text x="70" y="130">Web UI (React/Angular)</text>
    <rect x="300" y="100" width="200" height="60" fill="#d4edda" stroke="#333" stroke-width="2"/>
    <text x="340" y="130">API Gateway (Spring Boot)</text>
    <rect x="600" y="50" width="200" height="60" fill="#fff3cd" stroke="#333" stroke-width="2"/>
    <text x="630" y="80">Auth Service</text>
    <rect x="600" y="150" width="200" height="60" fill="#e2e3e5" stroke="#333" stroke-width="2"/>
    <text x="630" y="180">Youth Account Service</text>
    <rect x="600" y="250" width="200" height="60" fill="#f8d7da" stroke="#333" stroke-width="2"/>
    <text x="630" y="280">Transaction Service</text>
    <rect x="300" y="250" width="200" height="60" fill="#f5c6cb" stroke="#333" stroke-width="2"/>
    <text x="340" y="280">Settings DB (PostgreSQL)</text>

    <!-- Relations -->
    <line x1="230" y1="130" x2="300" y2="130" stroke="#333" marker-end="url(#arrow)"/>
    <text x="240" y="120">REST/HTTPS</text>
    <line x1="500" y1="130" x2="600" y2="80" stroke="#333" marker-end="url(#arrow)"/>
    <text x="520" y="100">OAuth2, RBAC</text>
    <line x1="500" y1="130" x2="600" y2="180" stroke="#333" marker-end="url(#arrow)"/>
    <text x="520" y="150">Youth Data</text>
    <line x1="500" y1="130" x2="600" y2="280" stroke="#333" marker-end="url(#arrow)"/>
    <text x="520" y="230">Txn API</text>
    <line x1="500" y1="160" x2="500" y2="250" stroke="#333" marker-end="url(#arrow)"/>
    <text x="430" y="230">JDBC/ORM</text>

    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#333" />
      </marker>
    </defs>
  </g>
</svg>