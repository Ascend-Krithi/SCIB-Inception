<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" font-family="Arial,Helvetica,sans-serif" font-size="14">
  <rect x="30" y="30" width="180" height="60" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="8"/>
  <text x="120" y="65" text-anchor="middle" fill="#1976D2">Banking Web Application</text>

  <rect x="250" y="30" width="180" height="60" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="8"/>
  <text x="340" y="65" text-anchor="middle" fill="#F57C00">API Gateway</text>

  <rect x="470" y="30" width="200" height="60" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="8"/>
  <text x="570" y="65" text-anchor="middle" fill="#388E3C">Youth Account Service</text>

  <rect x="470" y="120" width="200" height="60" fill="#FCE4EC" stroke="#D81B60" stroke-width="2" rx="8"/>
  <text x="570" y="155" text-anchor="middle" fill="#D81B60">Youth Account DB</text>

  <rect x="700" y="30" width="170" height="60" fill="#FFFDE7" stroke="#FBC02D" stroke-width="2" rx="8"/>
  <text x="785" y="65" text-anchor="middle" fill="#FBC02D">Payment Service (Ext)</text>

  <rect x="700" y="120" width="170" height="60" fill="#E1F5FE" stroke="#0288D1" stroke-width="2" rx="8"/>
  <text x="785" y="155" text-anchor="middle" fill="#0288D1">Transaction Service (Ext)</text>

  <!-- Connectors -->
  <line x1="210" y1="60" x2="250" y2="60" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="60" x2="470" y2="60" stroke="#F57C00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="60" x2="700" y2="60" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="90" x2="570" y2="120" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="60" x2="700" y2="150" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="60" x2="700" y2="150" stroke="#388E3C" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1976D2" />
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="30" y="480" width="350" height="40" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1" rx="5"/>
  <text x="40" y="505" fill="#333">Legend: Solid lines - REST/HTTPS; Dashed - Integration/Service Call</text>
</svg>
