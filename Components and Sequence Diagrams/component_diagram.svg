<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="900" height="480" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="480" fill="#fff"/>
  <g font-family="Arial" font-size="16">
    <text x="20" y="40" font-weight="bold">Youth Account Management: Component Diagram</text>
    <!-- Components -->
    <rect x="80" y="80" width="180" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="110" y="115">Web Application UI</text>
    <rect x="300" y="80" width="180" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <text x="330" y="115">Youth Account API</text>
    <rect x="520" y="80" width="180" height="60" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
    <text x="550" y="115">Youth Account DB</text>
    <rect x="300" y="200" width="180" height="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="340" y="235">Transaction Service</text>
    <rect x="520" y="200" width="180" height="60" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
    <text x="560" y="235">Payment Service</text>
    <rect x="80" y="200" width="180" height="60" fill="#fce4ec" stroke="#d81b60" stroke-width="2"/>
    <text x="110" y="235">Core Banking System</text>
    <!-- Relations -->
    <line x1="260" y1="110" x2="300" y2="110" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="265" y="95" font-size="14">REST/JSON</text>
    <line x1="480" y1="110" x2="520" y2="110" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="485" y="95" font-size="14">JDBC/ORM</text>
    <line x1="480" y1="230" x2="520" y2="230" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="485" y="215" font-size="14">REST/JSON</text>
    <line x1="480" y1="140" x2="480" y2="200" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="495" y="170" font-size="14">REST/JSON</text>
    <line x1="260" y1="230" x2="300" y2="230" stroke="#d81b60" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="265" y="215" font-size="14">SOAP/REST</text>
    <!-- Security & Compliance -->
    <text x="20" y="350" font-size="14" font-style="italic">Security: OAuth2, RBAC, audit logging, encrypted data (GDPR, PCI-DSS, ISO 27001)</text>
    <text x="20" y="370" font-size="14" font-style="italic">Compliance: All API access/actions logged. Parent/youth data protected.</text>
    <text x="20" y="390" font-size="14" font-style="italic">Availability: 99.99% uptime, HA deployment, disaster recovery enabled.</text>
    <!-- Arrow definition -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2"/>
      </marker>
    </defs>
  </g>
</svg>