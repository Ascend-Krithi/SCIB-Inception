<?xml version="1.0" encoding="UTF-8"?>
<!-- Mermaid SVG: Youth Account Parental Fund Management Component Diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <g font-family="sans-serif" font-size="16">
    <!-- Web Application -->
    <rect x="60" y="80" width="210" height="70" fill="#cce6ff" stroke="#0366d6" stroke-width="2" rx="12"/>
    <text x="165" y="120" text-anchor="middle">Web Application (React/Angular)</text>

    <!-- Youth Account API -->
    <rect x="330" y="80" width="230" height="70" fill="#e6f7ff" stroke="#00aaff" stroke-width="2" rx="12"/>
    <text x="445" y="120" text-anchor="middle">Youth Account API (Spring Boot)</text>

    <!-- Youth Account DB -->
    <rect x="330" y="200" width="230" height="60" fill="#fff2cc" stroke="#ffb300" stroke-width="2" rx="12"/>
    <text x="445" y="235" text-anchor="middle">Youth Account DB (PostgreSQL)</text>

    <!-- Account Service -->
    <rect x="600" y="50" width="220" height="55" fill="#e0ffe0" stroke="#33cc33" stroke-width="2" rx="12"/>
    <text x="710" y="85" text-anchor="middle">Account Service (REST)</text>

    <!-- Transaction Service -->
    <rect x="600" y="120" width="220" height="55" fill="#e0ffe0" stroke="#33cc33" stroke-width="2" rx="12"/>
    <text x="710" y="155" text-anchor="middle">Transaction Service (REST)</text>

    <!-- Payment Service -->
    <rect x="600" y="190" width="220" height="55" fill="#e0ffe0" stroke="#33cc33" stroke-width="2" rx="12"/>
    <text x="710" y="225" text-anchor="middle">Payment Service (REST)</text>

    <!-- Notification Service -->
    <rect x="600" y="260" width="220" height="55" fill="#e0ffe0" stroke="#33cc33" stroke-width="2" rx="12"/>
    <text x="710" y="295" text-anchor="middle">Notification Service (REST)</text>

    <!-- Arrows -->
    <!-- WebApp to API -->
    <line x1="270" y1="115" x2="330" y2="115" stroke="#0366d6" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- API to DB -->
    <line x1="445" y1="150" x2="445" y2="200" stroke="#ffb300" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- API to Account Service -->
    <line x1="560" y1="115" x2="600" y2="77" stroke="#33cc33" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- API to Transaction Service -->
    <line x1="560" y1="115" x2="600" y2="147" stroke="#33cc33" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- API to Payment Service -->
    <line x1="560" y1="115" x2="600" y2="217" stroke="#33cc33" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- API to Notification Service -->
    <line x1="560" y1="115" x2="600" y2="287" stroke="#33cc33" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Arrowhead marker definition -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#222" />
      </marker>
    </defs>
  </g>
</svg>
