<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Sequence Diagram: Parent manages youth account (dashboard, fund transfer, limits, transactions) -->
<svg width="900" height="620" xmlns="http://www.w3.org/2000/svg">
  <style>
    .actor { font: bold 16px sans-serif; fill: #222; }
    .lifeline { stroke: #888; stroke-dasharray: 6 4; }
    .message { stroke: #222; marker-end: url(#arrow); }
    .note { font: italic 13px sans-serif; fill: #666; }
    .box { fill: #eef; stroke: #aac; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#222" />
    </marker>
  </defs>

  <!-- Actors -->
  <text x="60" y="40" class="actor">Parent/Guardian</text>
  <text x="220" y="40" class="actor">Web UI</text>
  <text x="380" y="40" class="actor">API Gateway</text>
  <text x="540" y="40" class="actor">Youth Account Service</text>
  <text x="700" y="40" class="actor">Core Banking</text>
  <text x="860" y="40" class="actor">Transaction Service</text>

  <!-- Lifelines -->
  <line x1="80" x2="80" y1="60" y2="580" class="lifeline"/>
  <line x1="240" x2="240" y1="60" y2="580" class="lifeline"/>
  <line x1="400" x2="400" y1="60" y2="580" class="lifeline"/>
  <line x1="560" x2="560" y1="60" y2="580" class="lifeline"/>
  <line x1="720" x2="720" y1="60" y2="580" class="lifeline"/>
  <line x1="880" x2="880" y1="60" y2="580" class="lifeline"/>

  <!-- Messages -->
  <!-- Login/Access Dashboard -->
  <text x="100" y="80" class="note">1. Login / access dashboard</text>
  <line x1="80" x2="240" y1="90" y2="90" class="message"/>
  <text x="250" y="80" class="note">OAuth2 token (parent)</text>
  <line x1="240" x2="400" y1="110" y2="110" class="message"/>
  <text x="410" y="105" class="note">Validate token</text>
  <line x1="400" x2="560" y1="130" y2="130" class="message"/>
  <text x="570" y="125" class="note">/dashboard API</text>
  <line x1="560" x2="720" y1="150" y2="150" class="message"/>
  <text x="730" y="145" class="note">Fetch account data</text>
  <line x1="560" x2="880" y1="170" y2="170" class="message"/>
  <text x="885" y="165" class="note">Fetch transactions</text>
  <line x1="720" x2="560" y1="190" y2="190" class="message" marker-end="url(#arrow)"/>
  <line x1="880" x2="560" y1="210" y2="210" class="message" marker-end="url(#arrow)"/>
  <line x1="560" x2="400" y1="230" y2="230" class="message" marker-end="url(#arrow)"/>
  <line x1="400" x2="240" y1="250" y2="250" class="message" marker-end="url(#arrow)"/>
  <line x1="240" x2="80" y1="270" y2="270" class="message" marker-end="url(#arrow)"/>

  <!-- Fund Transfer -->
  <text x="100" y="300" class="note">2. Parent initiates fund transfer</text>
  <line x1="80" x2="240" y1="310" y2="310" class="message"/>
  <line x1="240" x2="400" y1="330" y2="330" class="message"/>
  <text x="410" y="325" class="note">POST /fund-transfer</text>
  <line x1="400" x2="560" y1="350" y2="350" class="message"/>
  <line x1="560" x2="720" y1="370" y2="370" class="message"/>
  <text x="730" y="365" class="note">Transfer funds</text>
  <line x1="720" x2="560" y1="390" y2="390" class="message" marker-end="url(#arrow)"/>
  <line x1="560" x2="400" y1="410" y2="410" class="message" marker-end="url(#arrow)"/>
  <line x1="400" x2="240" y1="430" y2="430" class="message" marker-end="url(#arrow)"/>
  <line x1="240" x2="80" y1="450" y2="450" class="message" marker-end="url(#arrow)"/>

  <!-- Set Spending Limit -->
  <text x="100" y="480" class="note">3. Set/Update spending limit</text>
  <line x1="80" x2="240" y1="490" y2="490" class="message"/>
  <line x1="240" x2="400" y1="510" y2="510" class="message"/>
  <text x="410" y="505" class="note">PUT /spending-limit</text>
  <line x1="400" x2="560" y1="530" y2="530" class="message"/>
  <line x1="560" x2="400" y1="550" y2="550" class="message" marker-end="url(#arrow)"/>
  <line x1="400" x2="240" y1="570" y2="570" class="message" marker-end="url(#arrow)"/>
  <line x1="240" x2="80" y1="590" y2="590" class="message" marker-end="url(#arrow)"/>
</svg>