<?xml version="1.0" standalone="no"?>
<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <title>Sequence Diagram - Youth Account Parental Controls</title>
  <desc>Sequence of major API operations and service interactions for youth account parental controls</desc>
  <g font-family="Arial" font-size="15">
    <!-- Lifelines -->
    <line x1="80" x2="80" y1="60" y2="540" stroke="#999" stroke-dasharray="5,5"/>
    <text x="60" y="50">Parent</text>
    <line x1="220" x2="220" y1="60" y2="540" stroke="#999" stroke-dasharray="5,5"/>
    <text x="190" y="50">Web UI</text>
    <line x1="400" x2="400" y1="60" y2="540" stroke="#999" stroke-dasharray="5,5"/>
    <text x="365" y="50">API Gateway</text>
    <line x1="600" x2="600" y1="60" y2="540" stroke="#999" stroke-dasharray="5,5"/>
    <text x="570" y="50">Auth Service</text>
    <line x1="750" x2="750" y1="60" y2="540" stroke="#999" stroke-dasharray="5,5"/>
    <text x="710" y="50">Youth Account Svc</text>
    <line x1="870" x2="870" y1="60" y2="540" stroke="#999" stroke-dasharray="5,5"/>
    <text x="830" y="50">Txn Service</text>

    <!-- Sequence: Dashboard Load -->
    <text x="20" y="90">1. Dashboard Load</text>
    <polygon points="80,100 220,100 220,110 80,110" fill="#e0e0e0" />
    <line x1="100" x2="220" y1="105" y2="105" stroke="#333" marker-end="url(#arrow)"/>
    <text x="120" y="95">Open UI</text>
    <line x1="220" x2="400" y1="120" y2="120" stroke="#333" marker-end="url(#arrow)"/>
    <text x="250" y="115">GET /dashboard</text>
    <line x1="400" x2="600" y1="140" y2="140" stroke="#333" marker-end="url(#arrow)"/>
    <text x="420" y="135">OAuth2 Validate</text>
    <line x1="600" x2="400" y1="160" y2="160" stroke="#333" marker-end="url(#arrow)"/>
    <text x="520" y="155">200 OK</text>
    <line x1="400" x2="750" y1="180" y2="180" stroke="#333" marker-end="url(#arrow)"/>
    <text x="430" y="175">Read Account</text>
    <line x1="750" x2="400" y1="200" y2="200" stroke="#333" marker-end="url(#arrow)"/>
    <text x="650" y="195">Account Data</text>
    <line x1="400" x2="870" y1="220" y2="220" stroke="#333" marker-end="url(#arrow)"/>
    <text x="430" y="215">Get Txns</text>
    <line x1="870" x2="400" y1="240" y2="240" stroke="#333" marker-end="url(#arrow)"/>
    <text x="800" y="235">Txn List</text>
    <line x1="400" x2="220" y1="260" y2="260" stroke="#333" marker-end="url(#arrow)"/>
    <text x="250" y="255">Dashboard Data</text>
    <line x1="220" x2="80" y1="280" y2="280" stroke="#333" marker-end="url(#arrow)"/>
    <text x="120" y="275">Render UI</text>

    <!-- Sequence: Fund Transfer -->
    <text x="20" y="310">2. Fund Transfer</text>
    <polygon points="80,320 220,320 220,330 80,330" fill="#e0e0e0" />
    <line x1="100" x2="220" y1="325" y2="325" stroke="#333" marker-end="url(#arrow)"/>
    <text x="120" y="315">Submit Form</text>
    <line x1="220" x2="400" y1="340" y2="340" stroke="#333" marker-end="url(#arrow)"/>
    <text x="250" y="335">POST /fund-transfer</text>
    <line x1="400" x2="600" y1="360" y2="360" stroke="#333" marker-end="url(#arrow)"/>
    <text x="420" y="355">OAuth2 Validate</text>
    <line x1="600" x2="400" y1="380" y2="380" stroke="#333" marker-end="url(#arrow)"/>
    <text x="520" y="375">200 OK</text>
    <line x1="400" x2="870" y1="400" y2="400" stroke="#333" marker-end="url(#arrow)"/>
    <text x="430" y="395">Process Transfer</text>
    <line x1="870" x2="400" y1="420" y2="420" stroke="#333" marker-end="url(#arrow)"/>
    <text x="800" y="415">Transfer Result</text>
    <line x1="400" x2="220" y1="440" y2="440" stroke="#333" marker-end="url(#arrow)"/>
    <text x="250" y="435">Result</text>
    <line x1="220" x2="80" y1="460" y2="460" stroke="#333" marker-end="url(#arrow)"/>
    <text x="120" y="455">Show Status</text>

    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#333" />
      </marker>
    </defs>
  </g>
</svg>