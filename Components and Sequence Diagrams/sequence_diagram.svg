<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Arial" font-size="16">
    <rect x="20" y="20" width="120" height="40" fill="#e6f2ff" stroke="#0074d9"/>
    <text x="30" y="45">Parent/Guardian</text>
    <rect x="170" y="20" width="120" height="40" fill="#e6f2ff" stroke="#0074d9"/>
    <text x="180" y="45">Banking Web App</text>
    <rect x="320" y="20" width="120" height="40" fill="#e6f2ff" stroke="#0074d9"/>
    <text x="330" y="45">Youth Account API</text>
    <rect x="470" y="20" width="120" height="40" fill="#e6f2ff" stroke="#0074d9"/>
    <text x="480" y="45">Core Banking</text>
    <rect x="620" y="20" width="120" height="40" fill="#e6f2ff" stroke="#0074d9"/>
    <text x="630" y="45">IAM/OAuth2</text>
    <rect x="770" y="20" width="120" height="40" fill="#e6f2ff" stroke="#0074d9"/>
    <text x="780" y="45">Youth</text>
    <!-- Sequence flows -->
    <line x1="80" y1="60" x2="230" y2="60" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="100" y="55" font-size="14">Login, manage account</text>
    <line x1="230" y1="80" x2="370" y2="80" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="75" font-size="14">API call: dashboard</text>
    <line x1="370" y1="100" x2="520" y2="100" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="95" font-size="14">Account, ledger query</text>
    <line x1="370" y1="120" x2="670" y2="120" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="115" font-size="14">OAuth2 token validation</text>
    <line x1="230" y1="140" x2="370" y2="140" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="135" font-size="14">API call: fund-transfer</text>
    <line x1="370" y1="160" x2="520" y2="160" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="155" font-size="14">Fund transfer, update balance</text>
    <line x1="230" y1="180" x2="370" y2="180" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="175" font-size="14">API call: set limit</text>
    <line x1="370" y1="200" x2="520" y2="200" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="195" font-size="14">Update weekly limit</text>
    <line x1="230" y1="220" x2="370" y2="220" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="215" font-size="14">API call: transactions</text>
    <line x1="370" y1="240" x2="520" y2="240" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="235" font-size="14">Transaction history</text>
    <line x1="780" y1="60" x2="230" y2="60" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="790" y="55" font-size="14">View dashboard</text>
    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0,0 10,5 0,10" fill="#111"/>
      </marker>
    </defs>
  </g>
</svg>