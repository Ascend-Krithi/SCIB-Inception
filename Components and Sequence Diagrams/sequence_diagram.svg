<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="500" xmlns="http://www.w3.org/2000/svg">
  <desc>Sequence Diagram: Parent manages youth account, allocates funds, sets limits, views dashboard and transactions. All flows OAuth2 secured, RBAC enforced, audit logged.</desc>
  <g font-family="monospace" font-size="16">
    <!-- Participants -->
    <text x="60" y="40">Parent/Guardian</text>
    <text x="260" y="40">Web UI</text>
    <text x="460" y="40">API Gateway</text>
    <text x="660" y="40">Youth Account Service</text>
    <text x="860" y="40">Auth Service</text>
    <text x="1060" y="40">Core Banking</text>
    <text x="1260" y="40">Transaction Service</text>
    <!-- Lifelines -->
    <line x1="80" x2="80" y1="60" y2="440" stroke="#999" stroke-dasharray="4"/>
    <line x1="280" x2="280" y1="60" y2="440" stroke="#999" stroke-dasharray="4"/>
    <line x1="480" x2="480" y1="60" y2="440" stroke="#999" stroke-dasharray="4"/>
    <line x1="680" x2="680" y1="60" y2="440" stroke="#999" stroke-dasharray="4"/>
    <line x1="880" x2="880" y1="60" y2="440" stroke="#999" stroke-dasharray="4"/>
    <line x1="1080" x2="1080" y1="60" y2="440" stroke="#999" stroke-dasharray="4"/>
    <line x1="1280" x2="1280" y1="60" y2="440" stroke="#999" stroke-dasharray="4"/>
    <!-- Flows -->
    <!-- Login and Token -->
    <text x="100" y="75" font-size="13">1. Login/Authenticate</text>
    <polygon points="80,90 280,90 276,98 84,98" fill="#90caf9"/>
    <line x1="80" y1="90" x2="280" y2="90" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="150" y="105" font-size="12">OAuth2 Credentials</text>
    <polygon points="280,110 880,110 876,118 284,118" fill="#e3f2fd"/>
    <line x1="280" y1="110" x2="880" y2="110" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="430" y="125" font-size="12">Token Validation</text>
    <polygon points="880,130 280,130 284,138 876,138" fill="#e3f2fd"/>
    <line x1="880" y1="130" x2="280" y2="130" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="430" y="145" font-size="12">JWT Token</text>
    <!-- Dashboard Access -->
    <polygon points="80,160 280,160 276,168 84,168" fill="#c8e6c9"/>
    <line x1="80" y1="160" x2="280" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="100" y="175" font-size="13">2. View Dashboard</text>
    <polygon points="280,180 480,180 476,188 284,188" fill="#e8f5e9"/>
    <line x1="280" y1="180" x2="480" y2="180" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="340" y="195" font-size="12">GET /dashboard</text>
    <polygon points="480,200 680,200 676,208 484,208" fill="#e8f5e9"/>
    <line x1="480" y1="200" x2="680" y2="200" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="540" y="215" font-size="12">RBAC, Audit Log</text>
    <polygon points="680,220 1080,220 1076,228 684,228" fill="#fffde7"/>
    <line x1="680" y1="220" x2="1080" y2="220" stroke="#fbc02d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="800" y="235" font-size="12">Account Data</text>
    <polygon points="1080,240 680,240 684,248 1076,248" fill="#fffde7"/>
    <line x1="1080" y1="240" x2="680" y2="240" stroke="#fbc02d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="800" y="255" font-size="12">Account Data</text>
    <polygon points="680,260 480,260 484,268 676,268" fill="#e8f5e9"/>
    <line x1="680" y1="260" x2="480" y2="260" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="480,270 280,270 284,278 476,278" fill="#e8f5e9"/>
    <line x1="480" y1="270" x2="280" y2="270" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="280,280 80,280 84,288 276,288" fill="#c8e6c9"/>
    <line x1="280" y1="280" x2="80" y2="280" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Fund Transfer -->
    <polygon points="80,300 280,300 276,308 84,308" fill="#ffe0b2"/>
    <line x1="80" y1="300" x2="280" y2="300" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="100" y="315" font-size="13">3. Fund Transfer</text>
    <polygon points="280,320 480,320 476,328 284,328" fill="#fff3e0"/>
    <line x1="280" y1="320" x2="480" y2="320" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="340" y="335" font-size="12">POST /fund-transfer</text>
    <polygon points="480,340 680,340 676,348 484,348" fill="#fff3e0"/>
    <line x1="480" y1="340" x2="680" y2="340" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="680,350 1080,350 1076,358 684,358" fill="#fffde7"/>
    <line x1="680" y1="350" x2="1080" y2="350" stroke="#fbc02d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="800" y="365" font-size="12">Transfer Funds</text>
    <polygon points="1080,370 680,370 684,378 1076,378" fill="#fffde7"/>
    <line x1="1080" y1="370" x2="680" y2="370" stroke="#fbc02d" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="680,380 480,380 484,388 676,388" fill="#fff3e0"/>
    <line x1="680" y1="380" x2="480" y2="380" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="480,390 280,390 284,398 476,398" fill="#fff3e0"/>
    <line x1="480" y1="390" x2="280" y2="390" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="280,400 80,400 84,408 276,408" fill="#ffe0b2"/>
    <line x1="280" y1="400" x2="80" y2="400" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Audit Log -->
    <text x="700" y="420" font-size="12" fill="#616161">All actions RBAC enforced, OAuth2 validated, audit logged per NFR.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#1976d2"/>
    </marker>
  </defs>
</svg>