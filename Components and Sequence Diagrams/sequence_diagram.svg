<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="900" height="640" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="640" fill="#fff"/>
  <g font-family="Arial" font-size="16">
    <text x="20" y="40" font-weight="bold">Youth Account Management: Sequence Diagram</text>
    <text x="20" y="70">Actors: Parent (via Web App), Youth, API Gateway, Youth Account API, DB, Transaction Service, Payment Service, Bank Core</text>
    <text x="20" y="100">Scenario: Fund Transfer from Parent to Youth Account</text>
    <!-- Lifelines -->
    <line x1="100" y1="120" x2="100" y2="580" stroke="#888" stroke-dasharray="4"/>
    <text x="80" y="115">Parent</text>
    <line x1="200" y1="120" x2="200" y2="580" stroke="#888" stroke-dasharray="4"/>
    <text x="180" y="115">Web App</text>
    <line x1="320" y1="120" x2="320" y2="580" stroke="#888" stroke-dasharray="4"/>
    <text x="300" y="115">API Gateway</text>
    <line x1="440" y1="120" x2="440" y2="580" stroke="#888" stroke-dasharray="4"/>
    <text x="420" y="115">Youth Account API</text>
    <line x1="560" y1="120" x2="560" y2="580" stroke="#888" stroke-dasharray="4"/>
    <text x="540" y="115">DB</text>
    <line x1="680" y1="120" x2="680" y2="580" stroke="#888" stroke-dasharray="4"/>
    <text x="660" y="115">Transaction Service</text>
    <line x1="800" y1="120" x2="800" y2="580" stroke="#888" stroke-dasharray="4"/>
    <text x="780" y="115">Payment Service</text>
    <!-- Sequence steps -->
    <text x="110" y="150">1. Initiate fund transfer (Parent → Web App)</text>
    <line x1="100" y1="160" x2="200" y2="160" stroke="#000" marker-end="url(#arrow)"/>
    <text x="210" y="180">2. Submit transfer request (Web App → API Gateway)</text>
    <line x1="200" y1="190" x2="320" y2="190" stroke="#000" marker-end="url(#arrow)"/>
    <text x="330" y="210">3. Forward to Youth Account API (API Gateway → Youth Account API)</text>
    <line x1="320" y1="220" x2="440" y2="220" stroke="#000" marker-end="url(#arrow)"/>
    <text x="450" y="240">4. Validate parent, youth account, sufficient funds (Youth Account API)</text>
    <text x="450" y="260">5. Update DB: Deduct parent, credit youth (Youth Account API → DB)</text>
    <line x1="440" y1="270" x2="560" y2="270" stroke="#000" marker-end="url(#arrow)"/>
    <text x="570" y="290">6. Log transaction (Youth Account API → Transaction Service)</text>
    <line x1="440" y1="300" x2="680" y2="300" stroke="#000" marker-end="url(#arrow)"/>
    <text x="690" y="320">7. Initiate fund transfer (Youth Account API → Payment Service)</text>
    <line x1="440" y1="330" x2="800" y2="330" stroke="#000" marker-end="url(#arrow)"/>
    <text x="810" y="350">8. Confirm transfer (Payment Service → Youth Account API)</text>
    <line x1="800" y1="360" x2="440" y2="360" stroke="#000" marker-end="url(#arrow)"/>
    <text x="450" y="380">9. Respond to API Gateway: Transfer success/failure</text>
    <line x1="440" y1="390" x2="320" y2="390" stroke="#000" marker-end="url(#arrow)"/>
    <text x="330" y="410">10. API Gateway responds to Web App</text>
    <line x1="320" y1="420" x2="200" y2="420" stroke="#000" marker-end="url(#arrow)"/>
    <text x="210" y="440">11. Web App shows confirmation to Parent</text>
    <line x1="200" y1="450" x2="100" y2="450" stroke="#000" marker-end="url(#arrow)"/>
    <!-- Security and Audit -->
    <text x="20" y="480" font-style="italic">Security: OAuth2 token checked at API Gateway. RBAC enforced. All actions audit logged.</text>
    <text x="20" y="500" font-style="italic">Errors: Insufficient funds, invalid account, unauthorized - handled and returned as per OpenAPI spec.</text>
    <!-- Arrow definition -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
      </marker>
    </defs>
  </g>
</svg>