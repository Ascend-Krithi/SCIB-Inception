<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600">
  <rect width="900" height="600" fill="#fff"/>
  <text x="20" y="40" font-size="28" font-family="Arial" font-weight="bold">Sequence Diagram: Youth Account Management API</text>
  <text x="20" y="80" font-size="20" font-family="Arial">Actors: Parent/Guardian, API Gateway, Youth Account Service, Core Banking, Transaction Service, Notification Service</text>
  <line x1="140" y1="120" x2="140" y2="520" stroke="#000" stroke-width="2"/>
  <text x="110" y="115" font-size="16" font-family="Arial">Parent</text>
  <line x1="300" y1="120" x2="300" y2="520" stroke="#000" stroke-width="2"/>
  <text x="250" y="115" font-size="16" font-family="Arial">API Gateway</text>
  <line x1="460" y1="120" x2="460" y2="520" stroke="#000" stroke-width="2"/>
  <text x="410" y="115" font-size="16" font-family="Arial">Youth Account Service</text>
  <line x1="620" y1="120" x2="620" y2="520" stroke="#000" stroke-width="2"/>
  <text x="590" y="115" font-size="16" font-family="Arial">Core Banking</text>
  <line x1="780" y1="120" x2="780" y2="520" stroke="#000" stroke-width="2"/>
  <text x="730" y="115" font-size="16" font-family="Arial">Txn/Notif Service</text>
  <!-- Sequence: Dashboard -->
  <text x="20" y="150" font-size="16" font-family="Arial">1. Dashboard Retrieval</text>
  <polygon points="140,160 300,160 295,170 145,170" fill="#e0e0e0" stroke="#000" stroke-width="1"/>
  <text x="160" y="168" font-size="14" font-family="Arial">GET /dashboard</text>
  <polygon points="300,180 460,180 455,190 305,190" fill="#e0e0e0" stroke="#000" stroke-width="1"/>
  <text x="320" y="188" font-size="14" font-family="Arial">Validate OAuth2, RBAC</text>
  <polygon points="460,200 620,200 615,210 465,210" fill="#e0e0e0" stroke="#000" stroke-width="1"/>
  <text x="480" y="208" font-size="14" font-family="Arial">Fetch balance</text>
  <polygon points="460,220 780,220 775,230 465,230" fill="#e0e0e0" stroke="#000" stroke-width="1"/>
  <text x="480" y="228" font-size="14" font-family="Arial">Fetch transactions</text>
  <polygon points="460,240 460,250 300,250 300,240" fill="#e0e0e0" stroke="#000" stroke-width="1"/>
  <text x="320" y="248" font-size="14" font-family="Arial">Compose dashboard</text>
  <polygon points="300,260 140,260 145,270 295,270" fill="#e0e0e0" stroke="#000" stroke-width="1"/>
  <text x="160" y="268" font-size="14" font-family="Arial">Return dashboard</text>
  <!-- Sequence: Fund Transfer -->
  <text x="20" y="300" font-size="16" font-family="Arial">2. Fund Transfer</text>
  <polygon points="140,320 300,320 295,330 145,330" fill="#cfe2ff" stroke="#000" stroke-width="1"/>
  <text x="160" y="328" font-size="14" font-family="Arial">POST /fund-transfer</text>
  <polygon points="300,340 460,340 455,350 305,350" fill="#cfe2ff" stroke="#000" stroke-width="1"/>
  <text x="320" y="348" font-size="14" font-family="Arial">Validate OAuth2, RBAC</text>
  <polygon points="460,360 620,360 615,370 465,370" fill="#cfe2ff" stroke="#000" stroke-width="1"/>
  <text x="480" y="368" font-size="14" font-family="Arial">Execute transfer</text>
  <polygon points="620,380 460,380 465,390 615,390" fill="#cfe2ff" stroke="#000" stroke-width="1"/>
  <text x="490" y="388" font-size="14" font-family="Arial">Transfer result</text>
  <polygon points="460,400 780,400 775,410 465,410" fill="#cfe2ff" stroke="#000" stroke-width="1"/>
  <text x="480" y="408" font-size="14" font-family="Arial">Log transaction</text>
  <polygon points="460,420 780,420 775,430 465,430" fill="#cfe2ff" stroke="#000" stroke-width="1"/>
  <text x="480" y="428" font-size="14" font-family="Arial">Send notification</text>
  <polygon points="460,440 300,440 305,450 455,450" fill="#cfe2ff" stroke="#000" stroke-width="1"/>
  <text x="320" y="448" font-size="14" font-family="Arial">Return transfer result</text>
  <polygon points="300,460 140,460 145,470 295,470" fill="#cfe2ff" stroke="#000" stroke-width="1"/>
  <text x="160" y="468" font-size="14" font-family="Arial">Show transfer result</text>
  <!-- Sequence: Spending Limit -->
  <text x="20" y="500" font-size="16" font-family="Arial">3. Spending Limit</text>
  <polygon points="140,520 300,520 295,530 145,530" fill="#f9c2c2" stroke="#000" stroke-width="1"/>
  <text x="160" y="528" font-size="14" font-family="Arial">PUT /spending-limit</text>
  <polygon points="300,540 460,540 455,550 305,550" fill="#f9c2c2" stroke="#000" stroke-width="1"/>
  <text x="320" y="548" font-size="14" font-family="Arial">Validate OAuth2, RBAC</text>
  <polygon points="460,560 780,560 775,570 465,570" fill="#f9c2c2" stroke="#000" stroke-width="1"/>
  <text x="480" y="568" font-size="14" font-family="Arial">Update limit, log</text>
  <polygon points="460,580 300,580 305,590 455,590" fill="#f9c2c2" stroke="#000" stroke-width="1"/>
  <text x="320" y="588" font-size="14" font-family="Arial">Return limit result</text>
  <polygon points="300,600 140,600 145,610 295,610" fill="#f9c2c2" stroke="#000" stroke-width="1"/>
  <text x="160" y="608" font-size="14" font-family="Arial">Show limit result</text>
</svg>